<script id="quiz-data" type="application/json">{"banks":[{"id":"i11","title":"Cumex 1 Blok I.1","short":"I.1 · Musculoskeletal","subtitle":"Auricle Kedokteran Reguler 2025","about":"Terminologi medis, jaringan, sistem limfatik, tulang, bioenergetika dan keselamatan prosedur.","file":"Auricle_Soal dan Pembahasan Cumex 1 Blok I.1.pdf","year":"2025","range":"Soal: hlm. 2–3 · Pembahasan: hlm. 4–7"},{"id":"i12","title":"Cumex 1 Blok I.2","short":"I.2 · Cardiorespiratory","subtitle":"Rekap Cumex 1","about":"Lipoprotein, otot jantung, embriologi, sistem saraf, sirkulasi fetal dan transport membran.","file":"Rekap%20Cumex%201%20Blok%20I.2.pdf.pdf","year":"Rekap","range":"Soal dan pembahasan: hlm. 2–8"},{"id":"i12_2024","title":"Cumex 1 Blok I.2 · 2024","short":"I.2 · Arsip 2024","subtitle":"Astrocytes Kedokteran Reguler 2024","about":"Histologi, hemodinamika, sistem saraf otonom, metabolisme lipid dan aterosklerosis.","file":"Rekap dan Pembahasan Cumex 1 Blok I.2 - 2024.pdf","year":"2024","range":"Soal: hlm. 2–3 · Pembahasan: hlm. 4–9"},{"id":"uks1","title":"Ujian kumulatif · Sesi 1","short":"I.2 · UK Sesi 1","subtitle":"Ujian Kumulatif Blok I.2","about":"Baroreseptor, Frank–Starling, tekanan darah, lipoprotein, histologi dan embriologi.","file":"UK Sesi 1 Blok I.2 (1).pdf","year":"Sesi 1","range":"Soal: hlm. 1–5 · Sorotan kuning/biru dari sumber"}],"questions":[{"id":"i11-1","bank":"i11","n":1,"q":"Berikut ini yang merupakan terminologi untuk bagian yang plural (jamak) adalah?","options":["Clavicula","Bursa","Atria","Patella","Vertebra"],"key":"C","why":"Atria adalah bentuk jamak dari atrium. Beberapa nomina Latin yang berakhir -um menjadi -a pada bentuk jamaknya, misalnya bacterium menjadi bacteria.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"Plural = bentuk jamak; singular = bentuk tunggal.","topic":"Terminologi","clue":"Cari kata berbentuk jamak, bukan nama struktur yang sekadar terdengar Latin.","mental":"Dalam banyak istilah Latin, akhiran -um berubah menjadi -a saat jamak: atrium → atria.","choicesWhy":["Clavicula adalah bentuk tunggal.","Bursa adalah bentuk tunggal.","Atria adalah jamak dari atrium.","Patella adalah tunggal.","Vertebra adalah tunggal; jamaknya vertebrae."],"flow":[]},{"id":"i11-2","bank":"i11","n":2,"q":"Seorang pasien mengalami trauma yang menyebabkan fraktur di daerah periosteum di Ossa Femoris nya. Proses di bawah ini yang tidak begitu terdampak langsung oleh kejadian tersebut adalah?","options":["Hematopoiesis manusia dewasa","Proses penebalan tulang bagian luar","Proses penyembuhan fraktur","Tendon dan ligamen tulang","Perlindungan tulang"],"key":"A","why":"Periosteum membungkus permukaan luar tulang, membantu proteksi, perlekatan tendon atau ligamen dan proses perbaikan fraktur. Hematopoiesis berlangsung dalam sumsum tulang merah, bukan oleh periosteum.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"Peri- = sekitar; oste- = tulang; hematopoiesis = pembentukan sel darah.","topic":"Osteologi","clue":"Perhatikan kata TIDAK terdampak langsung. Cari fungsi yang bukan milik selaput luar tulang.","mental":"Periosteum seperti jaket pelindung dan tempat perlekatan tulang. Sumsum tulang adalah pabrik sel darah yang letaknya di dalam.","choicesWhy":["Pembentukan sel darah berasal dari sumsum tulang merah, bukan fungsi utama periosteum.","Periosteum ikut berperan dalam pertumbuhan appositional tulang.","Periosteum membantu proses perbaikan fraktur.","Periosteum memberi titik perlekatan tendon/ligamen.","Periosteum adalah selubung perlindungan tulang."],"flow":["Periosteum terdampak","Perlekatan & pertumbuhan tulang terganggu","Hematopoiesis tetap di sumsum merah"]},{"id":"i11-3","bank":"i11","n":3,"q":"Di bawah ini yang merupakan organ dari sistem limfa adalah?","options":["Glandula thyroidea","Trakea","Lien (limpa)","Vasa sanguinea","Pankreas"],"key":"C","why":"Lien atau limpa adalah organ limfatik sekunder yang menyaring darah, membantu respons imun, dan memproses sel darah tua.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"Lien = spleen = limpa.","topic":"Sistem limfatik","clue":"Pertanyaannya tentang organ limfatik. Singkirkan organ endokrin dan saluran napas.","mental":"Limpa adalah pos pemeriksaan sel darah, berbeda dari kelenjar tiroid atau pankreas.","choicesWhy":["Tiroid termasuk organ endokrin.","Trakea adalah saluran pernapasan.","Limpa adalah organ limfatik sekunder.","Vasa sanguinea merupakan sistem pembuluh darah.","Pankreas memiliki fungsi endokrin dan eksokrin."],"flow":[]},{"id":"i11-4","bank":"i11","n":4,"q":"Kumpulan sel-sel dapat membentuk jaringan yang salah satunya memiliki ciri tersusun rapat, terikat antara satu sama lain, dan memiliki komponen matriks ekstraseluler yang sedikit. Nama jaringan tersebut adalah?","options":["Textus Nervosus","Textus Epithelialis","Textus Muscularis Striatus Cardiacus","Textus Connectivus Compactus","Textus Connectivus Areolaris"],"key":"B","why":"Jaringan epitel terdiri atas sel-sel yang rapat dan saling terhubung oleh cell junctions, dengan matriks ekstraseluler relatif sedikit.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"Textus = jaringan; epithelialis = epitel.","topic":"Histologi dasar","clue":"Kata kunci: sel rapat, saling melekat, matriks ekstraseluler sedikit.","mental":"Epitel seperti susunan ubin yang rapat. Jaringan ikat biasanya mempunyai lebih banyak bahan di antara sel.","choicesWhy":["Jaringan saraf terdiri atas neuron dan sel glia, bukan ciri utama di soal.","Epitel disusun sel-sel rapat dengan matriks ekstraseluler sedikit.","Otot jantung tersusun kardiomiosit bercabang dan diskus interkalaris.","Jaringan ikat padat banyak serabut kolagen matriks.","Jaringan ikat areolar mempunyai banyak ruang dan substansi dasar."],"flow":[]},{"id":"i11-5","bank":"i11","n":5,"q":"Untuk menjaga healthy volunteer, kita perlu mengetahui prosedur-prosedur tertentu yang memiliki risiko mortalitas tinggi. Contoh dari prosedur itu adalah?","options":["MRI (Magnetic Resonance Imaging)","Donor Darah","Electrocardiogram","Kateterisasi Jantung","USG (Ultrasonografi)"],"key":"D","why":"Dari pilihan yang tersedia, kateterisasi jantung merupakan prosedur invasif yang risikonya lebih tinggi daripada pemeriksaan noninvasif rutin seperti EKG, MRI, dan USG.","page":2,"image":null,"post":null,"status":"fixed","note":"Perbandingan risiko bergantung pada indikasi, kondisi pasien, dan jenis prosedur; tidak berarti semua kateterisasi berisiko kematian tinggi.","term":"","topic":"Keselamatan klinis","clue":"Bandingkan prosedur invasif dengan pemeriksaan non-invasif yang rutin.","mental":"Pemeriksaan gambar seperti USG memantau dari luar. Kateter masuk ke pembuluh dan menuju jantung.","choicesWhy":["MRI non-invasif meski tidak bebas semua risiko.","Donor darah rutin berisiko kecil dengan skrining.","EKG mencatat aktivitas listrik kulit tanpa kateter masuk pembuluh.","Kateterisasi jantung melibatkan tindakan invasif.","USG umumnya non-invasif."],"flow":[]},{"id":"i11-6","bank":"i11","n":6,"q":"Diagnosis penyakit di bawah ini yang berdasarkan organisme penyebab penyakitnya adalah?","options":["Amoebiasis","Klinefelter Syndrome","Duchenne Muscular Atrophy","Addison Disease","Graves’ Disease"],"key":"A","why":"Amoebiasis dinamai dari kelompok organisme amoeba yang menyebabkan infeksi. Opsi lain menggunakan nama tokoh atau peneliti.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"-iasis biasanya menunjukkan kondisi/infestasi; amoeba = organisme bersel satu.","topic":"Terminologi","clue":"Penyakit apa yang namanya mencerminkan organisme penyebab, bukan nama peneliti?","mental":"Amoebiasis secara harfiah adalah penyakit akibat infeksi amoeba.","choicesWhy":["Amoebiasis menunjuk penyebab amoeba.","Sindrom Klinefelter adalah eponim dan kelainan kromosom.","Duchenne dinamai tokoh; penyakit distrofi muskular genetik.","Addison adalah nama tokoh; insufisiensi adrenal.","Graves adalah eponim penyakit tiroid autoimun."],"flow":[]},{"id":"i11-7","bank":"i11","n":7,"q":"Komponen biokimia di bawah ini yang dapat langsung dijadikan energi oleh otot adalah?","options":["Gliserol","Adenosin Trifosfat","Pyruvat","Glukosa","Phosphoenolpyruvate"],"key":"B","why":"ATP adalah molekul yang langsung digunakan oleh mesin kontraksi otot. Glukosa, piruvat dan substrat lain harus diproses dahulu agar energi kimianya dapat dipindahkan menjadi ATP.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Bioenergetika","clue":"Yang ditanya bahan bakar yang bisa dipakai oleh protein motor sekarang juga.","mental":"Glukosa adalah bahan baku di gudang. ATP seperti uang tunai yang langsung dibelanjakan oleh myosin.","choicesWhy":["Gliserol menjadi bahan baku metabolisme, bukan energi langsung myosin.","ATP dihidrolisis langsung oleh mesin kontraksi.","Piruvat lebih dulu diolah agar menghasilkan ATP.","Glukosa membutuhkan reaksi metabolik untuk menjadi ATP.","PEP adalah intermediat glikolisis, bukan mata uang energi kontraksi."],"flow":["Glukosa / asam lemak","Metabolisme menghasilkan ATP","ATP dipakai myosin","Kontraksi otot"]},{"id":"i11-8","bank":"i11","n":8,"q":"Bagian yang merupakan bagian tengah atau utama tulang panjang adalah?","options":["Epifisis","Metafisis","Diafisis","Periosteum","Endosteum"],"key":"C","why":"Diafisis adalah batang utama tulang panjang; epifisis berada di ujungnya, metafisis merupakan zona transisi, periosteum membungkus permukaan luar, dan endosteum melapisi permukaan dalam.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Osteologi","clue":"Cari istilah untuk batang utama di tengah tulang panjang.","mental":"Pikirkan tulang panjang sebagai pensil: epifisis adalah kedua ujung, diafisis adalah batangnya.","choicesWhy":["Epifisis adalah ujung tulang panjang.","Metafisis ada di antara epifisis dan diafisis.","Diafisis adalah batang utama tulang.","Periosteum menyelubungi permukaan luar.","Endosteum melapisi permukaan dalam tulang."],"flow":[]},{"id":"i11-9","bank":"i11","n":9,"q":"Homolog adalah ketika dua struktur anatomi dari hewan yang berbeda memiliki kesamaan struktur dasar namun berbeda fungsi karena asal nenek moyang yang sama. Selain itu terdapat juga analog, contoh dari analog adalah?","options":["Sirip paus dengan kaki kucing","Tangan manusia dengan kaki depan kuda","Tanduk rusa dengan tengkorak mamalia lainnya","Antena udang dan antena serangga","Sayap burung dan sayap serangga"],"key":"E","why":"Sayap burung dan sayap serangga sama-sama digunakan untuk terbang tetapi berevolusi dari struktur asal yang berbeda. Ini contoh analog. Lengan manusia dan kaki depan kuda adalah homolog.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Anatomi komparatif","clue":"Analog berarti fungsi mirip tetapi asal evolusinya berbeda.","mental":"Sayap burung dan sayap serangga sama-sama untuk terbang, tetapi dibangun dari struktur evolusioner berbeda.","choicesWhy":["Sirip paus dan kaki kucing homolog sebagai anggota gerak mamalia.","Lengan manusia dan kaki depan kuda homolog.","Tanduk rusa mempunyai hubungan perkembangan dengan struktur kranial mamalia.","Antena udang dan serangga berasal dari anggota gerak/appendiks arthropoda yang berkerabat.","Sayap burung dan serangga sama fungsinya terbang, tetapi berbeda asal struktur."],"flow":[]},{"id":"i11-10","bank":"i11","n":10,"q":"Dari word root di bawah ini yang berarti “Tuba” adalah?","options":["Cyst","Xanth","Salpinx","Myel","Phren"],"key":"C","why":"Salpinx berasal dari istilah Yunani untuk tabung atau terompet. Contohnya salpingitis yaitu inflamasi tuba uterina.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"Cyst = kandung/kista; xanth = kuning; myel = sumsum; phren = diafragma atau pikiran dalam terminologi tertentu.","topic":"Terminologi","clue":"Ini soal akar kata, bukan penyakit. Cari istilah yang berarti tabung/saluran.","mental":"Salpinx artinya tuba. Misalnya salpingitis adalah inflamasi tuba uterina.","choicesWhy":["Cyst- berkaitan dengan kantong/kista.","Xanth- berarti kuning.","Salpinx berarti tabung/tuba.","Myel- berarti sumsum.","Phren- dapat berarti diafragma atau pikiran menurut konteks akar katanya."],"flow":[]},{"id":"i12-1","bank":"i12","n":1,"q":"Apa yang terjadi ketika HDL masuk ke hepar?","options":["Berikatan dengan SRB-1","Berikatan dengan reseptor LDL"],"key":"A","why":"HDL membawa kolesterol kembali ke hepar. Reseptor SR-B1 memediasi pengambilan selektif ester kolesterol dari HDL oleh hepatosit.","page":2,"image":null,"post":"hdl_pathway","status":"fixed","note":"","term":"Hepar = hati; RCT = reverse cholesterol transport.","topic":"Lipoprotein","clue":"Fokus pada reseptor yang mengambil ester kolesterol dari HDL ke hati.","mental":"HDL seperti mobil pengangkut kolesterol kembali ke depot hati. SR-B1 adalah gerbang bongkar muatnya.","choicesWhy":["SR-B1 menerima ester kolesterol secara selektif dari HDL.","Reseptor LDL terutama mengenali partikel yang membawa ApoB-100/ApoE."],"flow":["Kolesterol jaringan","HDL mengangkut balik","SR-B1 pada hepatosit","Ester kolesterol masuk hati"]},{"id":"i12-2","bank":"i12","n":2,"q":"Apa yang terjadi pada gambar yang bertanda bintang kuning saat darah dari atrium ke ventrikel (diastol)?","options":["Relaksasi","Kontraksi","Kendur","Meregang"],"key":"A","why":"Sumber menyebut struktur bertanda adalah musculus papillaris, yang relaksasi pada fase ventricular filling sehingga katup atrioventrikular dapat terbuka oleh gradien tekanan.","page":2,"image":"papillary_stars","post":null,"status":"fixed","note":"Otot papiler menjaga chordae tendineae agar leaflet AV tidak prolaps saat sistol, bukan membuka katup secara aktif.","term":"Diastole = relaksasi/pengisian ventrikel; musculus papillaris = otot papiler.","topic":"Mekanika jantung","clue":"Identifikasi struktur bertanda, lalu pikirkan fase pengisian ventrikel.","mental":"Diastol adalah fase ruang ventrikel menerima darah. Otot papiler tidak sedang berkontraksi untuk menahan daun katup saat sistol.","choicesWhy":["Otot papiler relaksasi ketika ventrikel mengisi pada diastol.","Kontraksi papiler berkaitan sistol untuk mencegah prolaps katup AV.","Kendur adalah deskripsi umum, tetapi sumber memakai istilah fisiologis relaksasi.","Meregang bukan istilah jawaban mekanisme kontraksi otot yang dimaksud."],"flow":["Diastol dimulai","Tekanan ventrikel turun","Katup AV terbuka pasif","Ventrikel terisi darah"]},{"id":"i12-3","bank":"i12","n":3,"q":"Apa salah satu ciri fragile fibrous cap?","options":["Diameter 100 mikrometer","Diameter 200 mikrometer","Terdapat banyak smooth muscle","Inflamasi tunica adventitia","Tidak ada makrofag"],"key":"D","why":"Pembahasan PDF memilih inflamasi tunica adventitia. Plak yang rentan ruptur biasanya mempunyai fibrous cap tipis, banyak sel inflamasi/makrofag, dan relatif sedikit kolagen atau smooth muscle cells.","page":3,"image":null,"post":null,"status":"fixed","note":"Kunci D pada rekap tidak merupakan ciri histologis paling khas dari thin-cap fibroatheroma. Redaksi/opsi kurang tepat; catat perbedaan antara kunci sumber dan konsep klinis.","term":"Fragile = rapuh; fibrous cap = tudung jaringan fibrosa di atas inti lipid.","topic":"Penyakit koroner","clue":"Cari karakter plak yang mudah ruptur, tetapi kritisi jika opsi tidak memuat ciri khas.","mental":"Fibrous cap adalah atap plak. Atap yang tipis dan banyak makrofag menjadi lebih rapuh.","choicesWhy":["100 µm tidak mencerminkan fibrous cap sangat tipis secara khas.","200 µm lebih tebal daripada thin cap yang rentan.","Banyak otot polos umumnya membantu produksi matriks, bukan ciri cap rapuh.","Kunci dokumen menuliskan inflamasi adventitia; tetapi konsep utama plak rentan terkait inflamasi cap dan makrofag.","Tidak ada makrofag justru berlawanan dengan inflamasi pada plak rentan."],"flow":["LDL masuk intima","Inflamasi & foam cells","Fibrous cap menipis","Risiko ruptur dan trombus"]},{"id":"i12-4","bank":"i12","n":4,"q":"Reseptor apa yang menyebabkan kontraksi jantung (efek positif)?","options":["Gama","Beta-2","Beta-1","Alpha","Delta"],"key":"C","why":"Aktivasi reseptor adrenergik beta-1 meningkatkan kronotropi dan inotropi jantung melalui jalur simpatis.","page":3,"image":null,"post":"adrenergic","status":"fixed","note":"","term":"Inotropik positif = kekuatan kontraksi meningkat; kronotropik positif = frekuensi jantung meningkat.","topic":"Sistem saraf otonom","clue":"Apa reseptor simpatis utama pada jantung untuk efek inotropik positif?","mental":"β1 seperti pedal gas jantung. β2 lebih penting dalam relaksasi otot polos beberapa pembuluh.","choicesWhy":["Gama bukan reseptor adrenergik jantung utama dalam opsi.","Beta-2 berperan lebih besar pada beberapa otot polos vaskular.","Beta-1 adalah reseptor adrenergik utama efek positif pada denyut dan kontraksi jantung.","Alpha dapat bekerja pada pembuluh tetapi bukan jawaban utama kontraksi miokard.","Delta bukan reseptor adrenergik utama jantung."],"flow":[]},{"id":"i12-5","bank":"i12","n":5,"q":"Smooth part dari atrium dekstra terbentuk dari?","options":["Sinus venosus","Primitif atrium","Bulbus cordis","Truncus arteriosus","Primitif ventrikel"],"key":"A","why":"Bagian halus posterior atrium dextra (sinus venarum) berasal dari tanduk kanan sinus venosus. Bagian trabekular atrium berasal dari primitive atrium.","page":4,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Embriologi","clue":"Ingat asal embrional bagian licin posterior atrium kanan.","mental":"Bagian halus atrium kanan datang dari saluran masuk vena, yaitu sinus venosus.","choicesWhy":["Sinus venosus membentuk bagian halus posterior atrium dextra.","Atrium primitif terutama membentuk bagian trabekular/aurikula.","Bulbus cordis menyumbang bagian ventrikel/outflow.","Truncus arteriosus menyumbang bagian pembuluh keluar utama.","Ventrikel primitif berkontribusi ke ventrikel, bukan atrium kanan halus."],"flow":["Sinus venosus kanan","Melebur ke atrium dextra","Sinus venarum yang halus"]},{"id":"i12-6","bank":"i12","n":6,"q":"Manakah yang menyebabkan vasodilatasi pada otot skelet?","options":["Epinefrin reseptor B-1","Norepinefrin reseptor B-1","Norepinefrin reseptor B-2","Epinefrin reseptor a-1","Epinefrin reseptor B-2"],"key":"E","why":"Epinefrin yang berikatan dengan reseptor beta-2 pada pembuluh otot rangka menyebabkan relaksasi otot polos vaskular dan vasodilatasi.","page":4,"image":null,"post":"adrenergic","status":"fixed","note":"","term":"","topic":"Sistem saraf otonom","clue":"Hubungkan jenis katekolamin, reseptor, dan organ target.","mental":"Epinefrin + β2 pada pembuluh otot rangka membuka jalan agar aliran darah meningkat.","choicesWhy":["Beta-1 epinefrin terutama berhubungan dengan stimulasi jantung.","Norepinefrin beta-1 cenderung efek kardiak.","Norepinefrin hanya lemah pada beta-2 dibanding epinefrin.","Alpha-1 menghasilkan vasokonstriksi.","Epinefrin di beta-2 merelaksasi otot polos pembuluh otot rangka."],"flow":[]},{"id":"i12-7","bank":"i12","n":7,"q":"Manakah di bawah ini obliterasi dari prenatal ke postnatal yang tepat?","options":["Ductus venosus -> ligamentum venosum","Umbilical vena kiri -> ligamentum teres dari ginjal","Umbilical arteri -> ligamentum umbilical teres dari hepar"],"key":"A","why":"Setelah lahir, ductus venosus menjadi ligamentum venosum. Vena umbilicalis kiri menjadi ligamentum teres hepatis, sedangkan arteri umbilicalis distal menjadi ligamen umbilical medial.","page":5,"image":null,"post":null,"status":"fixed","note":"","term":"Obliterasi = saluran menutup dan menjadi sisa jaringan.","topic":"Sirkulasi fetal","clue":"Pasangkan sisa saluran janin dengan ligamentum setelah lahir.","mental":"Ductus venosus adalah jalan pintas darah janin melewati hati. Seusai lahir berubah menjadi ligamentum venosum.","choicesWhy":["Ductus venosus menutup menjadi ligamentum venosum.","Vena umbilikalis kiri menjadi ligamentum teres hepatis, bukan struktur ginjal.","Arteri umbilikalis distal menjadi ligamenta umbilicalia medialia."],"flow":["Ductus venosus janin","Sirkulasi neonatal berubah","Ligamentum venosum"]},{"id":"i12-8","bank":"i12","n":8,"q":"Truncus pulmonalis pada sirkulasi fetal mengarah kepada?","options":["Ductus venosus","Ductus arteriosus","Ventrikel kanan","Ventrikel kiri","Atrium kiri"],"key":"B","why":"Pada janin, sebagian besar darah dari truncus pulmonalis dialihkan ke aorta descendens melalui ductus arteriosus karena resistensi vaskular paru masih tinggi.","page":5,"image":null,"post":"fetal_circulation","status":"fixed","note":"","term":"Fetal = janin; ductus arteriosus = hubungan arteri pulmonalis ke aorta saat janin.","topic":"Sirkulasi fetal","clue":"Janin belum menggunakan paru seperti bayi baru lahir. Ke mana darah arteri pulmonalis dialihkan?","mental":"Ductus arteriosus mengalihkan darah dari arteri pulmonalis ke aorta.","choicesWhy":["Ductus venosus berada pada jalur vena umbilikalis menuju vena cava inferior melalui hati.","Ductus arteriosus menghubungkan truncus pulmonalis dengan aorta.","Ventrikel kanan adalah asal aliran ke truncus pulmonalis, bukan jalur pintas menuju aorta.","Ventrikel kiri bukan tujuan langsung truncus pulmonalis.","Atrium kiri menerima vena pulmonalis, bukan jalur utama trunkus pulmonalis janin."],"flow":["Ventrikel kanan","Truncus pulmonalis","Ductus arteriosus","Aorta descendens"]},{"id":"i12-9","bank":"i12","n":9,"q":"Nn cardiaci (trunchus sympathicus) akan menghasilkan efek apa ke jantung?","options":["Peningkatan heart rate","Penurunan heart rate"],"key":"A","why":"Serabut saraf simpatis kardiak mempercepat pembentukan impuls pada nodus SA dan umumnya meningkatkan heart rate.","page":6,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Sistem saraf otonom","clue":"Nn. cardiaci dari trunkus simpatikus adalah cabang simpatis, bukan vagus.","mental":"Simpatis memberi perintah gas: jantung memompa lebih cepat.","choicesWhy":["Cabang kardiak simpatis meningkatkan heart rate.","Penurunan heart rate khas aktivitas parasimpatis vagus."],"flow":[]},{"id":"i12-10","bank":"i12","n":10,"q":"Bagaimana dampak mekanisme saraf simpatis ke nodus SA?","options":["Terbukanya kanal K untuk terjadinya repolarisasi","Mempercepat sampai ke potensial aksi terbukanya kanal Ca"],"key":"B","why":"Stimulasi simpatis membuat depolarisasi spontan fase 4 sel pacemaker lebih curam, sehingga mencapai ambang potensial aksi lebih cepat.","page":7,"image":null,"post":"pacemaker_graph","status":"fixed","note":"","term":"","topic":"Elektrofisiologi","clue":"Pahami gradien depolarisasi spontan sel SA, bukan sekadar nama kanal.","mental":"Simpatis membuat tanjakan fase 4 lebih curam sehingga ambang tercapai lebih cepat.","choicesWhy":["Meningkatkan keluarnya K+ bukan mekanisme utama akselerasi fase 4 simpatis.","Simpatis mempercepat depolarisasi sehingga threshold kanal Ca lebih cepat dicapai."],"flow":["Aktivasi simpatis β1","Gradien fase 4 lebih curam","Threshold lebih cepat","Heart rate naik"]},{"id":"i12-11","bank":"i12","n":11,"q":"Manakah di bawah ini yang termasuk transpor aktif sekunder?","options":["Transpor Na+ dan K+","Masuknya glukosa bersama dengan masuknya Na+","Transpor Ca2+"],"key":"B","why":"SGLT mengangkut glukosa bersama Na+ dengan memanfaatkan gradien Na+ yang dibentuk pompa Na+/K+-ATPase. Karena energi berasal tidak langsung dari ATP, disebut transport aktif sekunder.","page":7,"image":null,"post":"na_glucose_transport","status":"fixed","note":"","term":"","topic":"Transport membran","clue":"Cari kotransport yang memakai gradien ion yang sebelumnya dibangun menggunakan ATP.","mental":"SGLT menumpang arus Na+ membawa glukosa; pompa Na/K mengisi ulang gradiennya.","choicesWhy":["Pompa Na/K ATPase memakai ATP langsung: transpor aktif primer.","SGLT memasukkan glukosa bersama Na+: transpor aktif sekunder.","Pompa Ca ATPase memakai ATP langsung; bila yang dimaksud pertukaran NCX konteks berbeda."],"flow":["ATP menjalankan Na/K pump","Gradien Na+ tinggi di luar sel","Na+ masuk lewat SGLT","Glukosa ikut masuk"]},{"id":"i12-12","bank":"i12","n":12,"q":"Sumber energi yang digunakan jantung pada kondisi aerobik basal?","options":["Asam laktat","Asam lemak","Asam amino","Glukosa","Keton"],"key":"B","why":"Pada kondisi aerobik basal jantung normal, oksidasi asam lemak merupakan penyumbang energi utama; proporsinya berubah sesuai keadaan nutrisi dan aktivitas.","page":8,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Metabolisme jantung","clue":"Kondisinya aerobik basal, bukan sesudah makan atau olahraga.","mental":"Dalam istirahat normal, jantung seperti mesin yang lebih banyak membakar asam lemak.","choicesWhy":["Laktat dapat menyumbang energi, terutama saat latihan, tetapi bukan sumber terbesar saat aerobik basal.","Asam lemak biasanya merupakan bahan bakar dominan jantung aerobik istirahat.","Asam amino kontribusinya kecil pada keadaan basal.","Glukosa penting tetapi kontribusi dasar biasanya lebih kecil daripada asam lemak.","Keton bisa dipakai jantung, terutama pada keadaan nutrisi tertentu."],"flow":[]},{"id":"i12_2024-1","bank":"i12_2024","n":1,"q":"Perhatikan struktur histologis pada preparat berikut ini! Bagian yang ditunjuk anak panah merupakan …","options":["Endotheliocytus","Fibroblastus","Myocytus Cardiacus","Myocytus Levis","Mesotheliocytus"],"key":"A","why":"Dokumen menyebut endotheliocytus, sel endotel yang melapisi lumen pembuluh darah, termasuk vasa vasorum pada dinding pembuluh besar.","page":2,"image":"histology_vas","post":null,"status":"fixed","note":"Gambar asli juga memberi label “Vasa vasorum” tepat pada arah panah. Pilihan tidak mencantumkan vasa vasorum sebagai struktur, sehingga kunci A bergantung pada maksud menamai sel pelapisnya.","term":"Vasa vasorum = pembuluh kecil yang memberi nutrisi dinding pembuluh besar.","topic":"Histologi vaskular","clue":"Perhatikan panah pada preparat dan bedakan dinding pembuluh dengan sel yang melapisinya.","mental":"Vasa vasorum adalah pembuluh kecil yang berada di dinding pembuluh besar. Endotelium melapisi lumennya.","choicesWhy":["Endotel melapisi lumen vasa vasorum, sesuai kunci sumber walau penunjuk lebih dekat pada pembuluhnya.","Fibroblas berada di jaringan ikat, bukan identitas sel lumen yang ditanya.","Kardiomiosit terdapat pada miokardium.","Otot polos ada di tunika media, bukan pelapis lumen.","Mesotel melapisi permukaan serosa."],"flow":[]},{"id":"i12_2024-2","bank":"i12_2024","n":2,"q":"IDL didapat dari . .","options":["Sintesis de novo di ginjal","Hidrolisis Chylomicron oleh Lipoprotein Lipase","Hidrolisis VLDL oleh Lipoprotein Lipase","Hidrolisis LDL oleh Lipoprotein Lipase","Sintesis de novo di Hepar"],"key":"C","why":"VLDL melepaskan trigliserida melalui aksi LPL dan dapat menjadi IDL (VLDL remnant). IDL kemudian diambil hati atau diubah lebih lanjut menjadi LDL.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Lipoprotein","clue":"Pikirkan urutan perubahan lipoprotein saat trigliserida dikeluarkan.","mental":"VLDL kehilangan trigliserida dengan bantuan LPL lalu menjadi IDL, kemudian dapat berubah menjadi LDL.","choicesWhy":["Ginjal bukan tempat sintesis utama IDL.","Hidrolisis kilomikron menghasilkan chylomicron remnant.","Hidrolisis trigliserida VLDL oleh LPL menghasilkan IDL.","LDL bukan prekursor IDL pada jalur normal.","Hati menghasilkan VLDL, bukan langsung IDL dalam jalur utama."],"flow":["VLDL membawa TAG","LPL memecah TAG","VLDL mengecil jadi IDL","Sebagian jadi LDL"]},{"id":"i12_2024-3","bank":"i12_2024","n":3,"q":"Terdapat vasa sanguinea yang menerima darah bertekanan tinggi dari cor. Struktur apakah yang menopang vasa sanguinea tersebut …","options":["Endothelium","Membrana Elastica Fenestrata","Textus non Striatus","Vasa Vasorum","Tunica Intima"],"key":"B","why":"Arteri elastik besar seperti aorta memiliki lamela elastik fenestrata yang melimpah di tunika media. Struktur ini membantu dinding meregang selama sistol dan kembali elastis saat diastol.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Histologi vaskular","clue":"Pembuluh mana yang menerima tekanan pulsasi tinggi langsung dari jantung?","mental":"Aorta seperti selang berlapis pegas. Lamela elastik menyimpan energi sistol dan melepaskannya saat diastol.","choicesWhy":["Endotel melapisi lumen dan mengatur permukaan, bukan penopang elastis dominan.","Lamela elastik fenestrata memungkinkan peregangan dan recoil arteri elastik.","Otot polos ada, tetapi pertanyaan mengarah ke dominasi elastin pada arteri bertekanan tinggi.","Vasa vasorum menutrisi dinding pembuluh besar.","Tunica intima lapisan dalam, bukan komponen pegas utama."],"flow":[]},{"id":"i12_2024-4","bank":"i12_2024","n":4,"q":"Kadar ion K+ yang tinggi pada ekstraseluler akan menyebabkan apa pada potensial aksi sel…","options":["Ion K+ memicu depolarisasi sitoplasma","Ion K+ menghambat repolarisasi mitokondria","Ion K+ menginduksi konduksi listrik ke nodus sinoatrialis (SA)","Ion K+ menghambat repolarisasi pada membran ekstraseluler","Ion K+ melakukan antiport dengan ion Ca2+ pada membran sel"],"key":"D","why":"Kunci rekap memilih D. Secara fisiologi, peningkatan K+ ekstraseluler membuat potensial ekuilibrium K+ kurang negatif, sehingga potensial membran istirahat sering menjadi lebih depolarisasi dan eksitabilitas/konduksi dapat berubah.","page":2,"image":null,"post":null,"status":"disputed","note":"Frasa “repolarisasi pada membran ekstraseluler” tidak tepat secara fisiologi. Tidak ada opsi yang menerangkan mekanisme hiperkalemia dengan baik. Untuk nilai, soal ini ditampilkan tetapi tidak dihitung sebagai soal berkunci pasti.","term":"","topic":"Elektrofisiologi","clue":"Soal membahas hiperkalemia tetapi opsi/kunci sumber tidak menggambarkannya dengan benar.","mental":"Jika K+ ekstrasel naik, gradien K+ menurun dan potensial istirahat cenderung kurang negatif, memengaruhi eksitabilitas.","choicesWhy":["K+ ekstrasel tinggi dapat mendepolarisasi membran istirahat, tetapi frasa opsi tidak menjelaskan mekanismenya baik.","Repolarisasi mitokondria bukan konteks potensial aksi kardiomiosit.","Ion K+ tidak langsung menginduksi impuls ke SA node seperti ini.","Ini kunci sumber tetapi istilah membran ekstraseluler keliru; repolarisasi berlaku pada potensial membran sel.","Bukan pertukaran wajib antiport K+ dengan Ca2+."],"flow":["K+ luar sel meningkat","Driving force K+ berkurang","Membran kurang negatif","Konduksi dapat terganggu"]},{"id":"i12_2024-5","bank":"i12_2024","n":5,"q":"Ligamentum Venosum merupakan obliterasi dari struktur …","options":["Arteri Umbilikalis","Vena Umbilikalis Sinistra","Truncus Arteriosus","Ductus Arteriosus","Ductus Venosus"],"key":"E","why":"Setelah lahir, ductus venosus menutup dan menjadi ligamentum venosum. Ductus arteriosus menjadi ligamentum arteriosum.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Sirkulasi fetal","clue":"Pasangkan ductus janin dan sisa ligamentumnya.","mental":"Ductus venosus menjadi ligamentum venosum; ductus arteriosus menjadi ligamentum arteriosum.","choicesWhy":["Arteri umbilikalis distal menjadi ligamenta umbilicalia medialia.","Vena umbilikalis kiri menjadi ligamentum teres hepatis.","Truncus arteriosus berkembang ke jalan keluar pembuluh besar.","Ductus arteriosus menjadi ligamentum arteriosum.","Ductus venosus menjadi ligamentum venosum."],"flow":[]},{"id":"i12_2024-6","bank":"i12_2024","n":6,"q":"Pengembangan dari bagian jantung yang menjadi smooth part of left ventricle disebut …","options":["Truncus Arteriosus","Bulbus Cordis","Primitive Ventricle","Primitive Atrium","Sinus Venosus"],"key":"B","why":"Komponen outflow atau bagian halus ventrikel kiri terkait perkembangan bulbus cordis, termasuk komponen conus cordis. Primitive ventricle terutama membentuk bagian trabekular ventrikel kiri.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Embriologi","clue":"Bagian halus ventrikel berasal dari struktur outflow, bukan bagian trabekular primitif.","mental":"Conus cordis dari bulbus cordis membentuk jalur keluar yang relatif halus pada ventrikel.","choicesWhy":["Truncus arteriosus berkontribusi ke aorta dan trunkus pulmonalis.","Bulbus cordis (conus cordis) membentuk bagian jalur keluar halus ventrikel.","Primitive ventricle terutama membentuk bagian trabekular ventrikel kiri.","Primitive atrium membentuk komponen atrium.","Sinus venosus berkontribusi terutama ke sinus venarum atrium kanan."],"flow":[]},{"id":"i12_2024-7","bank":"i12_2024","n":7,"q":"Kondisi seseorang berdiri setelah 30 detik bangun akan mengalami…","options":["Penurunan tekanan darah","Kenaikan tekanan diastolik","Penurunan tekanan sistolik","Vasodilatasi pembuluh kapiler","Kenaikan tekanan darah"],"key":"E","why":"Kunci sumber memilih peningkatan tekanan darah setelah sekitar 30 detik sebagai hasil kompensasi barorefleks. Berdiri mula-mula dapat menurunkan venous return dan tekanan darah sehingga sistem simpatis bekerja memulihkan tekanan.","page":2,"image":null,"post":null,"status":"fixed","note":"Perubahan tekanan 30 detik setelah berdiri bervariasi. Pada orang sehat tekanan sering pulih mendekati awal, bukan selalu lebih tinggi. Soal kurang menyebut keadaan awal dan parameter yang dibandingkan.","term":"","topic":"Hemodinamika","clue":"Ingat urutan respons segera saat bangkit berdiri dan barorefleks kompensasi.","mental":"Berdiri membuat darah terkumpul di tungkai, kemudian refleks meningkatkan simpatis untuk memulihkan tekanan.","choicesWhy":["Penurunan awal mungkin terjadi, tetapi setelah 30 detik ada kompensasi.","Tekanan diastolik dapat naik atau stabil, tergantung kondisi, bukan jawaban yang disorot sumber.","Tekanan sistolik bisa berubah dinamis, bukan aturan tunggal pada 30 detik.","Respons simpatis cenderung vasokonstriksi bukan vasodilatasi arteriola.","Sumber menandai kenaikan tekanan akibat pemulihan refleks, tetapi hasil nyata bervariasi."],"flow":[]},{"id":"i12_2024-8","bank":"i12_2024","n":8,"q":"Pembuluh arteri berikut yang memiliki textus muscularis yang paling tebal adalah…","options":["Arteri subclavia","Arteri coronaria","Arteri carotis communis","Arteri femoris","Aorta abdominalis"],"key":"D","why":"Rekap memilih arteria femoralis sebagai arteri tipe muskular berdiameter besar di ekstremitas. Aorta dan sejumlah cabang proksimal tergolong arteri elastik, meski arteri koroner juga tipe muskular.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Histologi vaskular","clue":"Bandingkan arteri elastik proksimal dengan arteri muskular distribusi.","mental":"Aorta kaya elastin. Arteri femoralis adalah arteri distribusi dengan tunika media kaya otot polos.","choicesWhy":["Subclavia besar mempunyai komponen elastik proksimal yang menonjol.","Coronaria adalah arteri muskular tetapi bukan yang paling tebal menurut konteks soal.","Carotis communis merupakan pembuluh besar dengan banyak komponen elastik.","Femoralis adalah arteri distribusi besar dengan tunika media muskular tebal.","Aorta termasuk arteri elastik."],"flow":[]},{"id":"i12_2024-9","bank":"i12_2024","n":9,"q":"Apa yang menyebabkan hipertrofi konsentrik pada ventrikel…","options":["Stenosis aorta","Injury cardio ischemia","Plak atherosclerosis","Thrombosis stent","Cardiomyopathy"],"key":"A","why":"Stenosis katup aorta meningkatkan afterload yang harus dilawan ventrikel kiri. Respons adaptasi terhadap pressure overload kronis sering berupa hipertrofi konsentrik.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Penyakit jantung","clue":"Pikirkan peningkatan pressure load, bukan volume load.","mental":"Saat stenosis aorta, jantung harus mendorong melawan pintu sempit sehingga dinding menebal ke dalam.","choicesWhy":["Stenosis aorta meningkatkan pressure overload, memicu hipertrofi konsentrik.","Iskemia lebih umum menimbulkan cedera/infark dan remodeling pascainfark.","Plak aterosklerosis koroner berkaitan iskemia, tidak khas hipertrofi konsentrik.","Trombosis stent bisa menyebabkan infark akut.","Kardiomiopati memiliki berbagai fenotipe dan tidak spesifik pressure overload aorta."],"flow":["Stenosis aorta","Afterload meningkat","Tekanan ventrikel tinggi","Hipertrofi konsentrik"]},{"id":"i12_2024-10","bank":"i12_2024","n":10,"q":"Respons ginjal terhadap penurunan tekanan darah pada tubuh ditandai dengan","options":["Sekresi angiotensin converting enzyme","Sekresi bradykinin","Sekresi renin","Sekresi epinefrin","Sekresi norepinefrin"],"key":"C","why":"Sel jukstaglomerular ginjal melepaskan renin saat perfusi ginjal menurun. Renin memulai RAAS dengan mengubah angiotensinogen menjadi angiotensin I.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Regulasi tekanan darah","clue":"Ginjal mendeteksi penurunan perfusi dan melepas enzim pemicu RAAS.","mental":"Renin memulai domino: angiotensinogen → Ang I → Ang II → aldosteron.","choicesWhy":["ACE mengubah Ang I menjadi Ang II, bukan mediator pertama yang dikeluarkan ginjal.","Bradikinin bukan pemicu utama RAAS sebagai respons ginjal.","Renin dilepas aparatus jukstaglomerular saat perfusi ginjal menurun.","Epinefrin disekresikan medula adrenal.","Norepinefrin berasal dari ujung saraf simpatis dan medula adrenal."],"flow":["Perfusi ginjal turun","Renin dilepas","Angiotensin II meningkat","Aldosteron & vasokonstriksi"]},{"id":"i12_2024-11","bank":"i12_2024","n":11,"q":"Penanda histologis dari adanya perubahan fatty streak menjadi awal dari aterosklerosis adalah…","options":["Kematian myofibra cardiaca secara eksponensial","Terjadi perdarahan intramural","Ditemukannya thrombus koroner","Dijumpai makrofag yang mengandung lipid","Ruptur pada perifer tunica media"],"key":"D","why":"Makrofag menelan lipid teroksidasi pada intima dan menjadi foam cells. Foam cells merupakan gambaran khas fatty streak dini.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Aterosklerosis","clue":"Cari ciri paling awal penumpukan lipid pada intima arteri.","mental":"Makrofag memakan LDL termodifikasi dan menjadi foam cell, yang membentuk fatty streak.","choicesWhy":["Kematian kardiomiosit adalah akibat iskemia/infark, bukan fatty streak arteri.","Perdarahan intramural muncul pada plak lanjut/komplikasi.","Trombus koroner berkaitan erosi/ruptur plak dan tahap lebih lanjut.","Makrofag berisi lipid (foam cells) menandai fatty streak awal.","Ruptur bukan ciri tahap paling awal."],"flow":["LDL tertahan di intima","LDL termodifikasi","Makrofag menelan lipid","Foam cell → fatty streak"]},{"id":"i12_2024-12","bank":"i12_2024","n":12,"q":"Efek yang diberikan oleh Rr. Cardiaci Nervi Vagi pada Sistem Cardiovascular adalah…","options":["Penurunan chromotropic (heart rate) pada cor","Vasodilatasi arteri carotis communis","Vasokonstriksi arteri coronaria","Penurunan tekanan sistolik","Peningkatan aktivitas parasimpatik (percabangan nervus vagus)"],"key":"C","why":"PDF mencetak C sebagai kunci. Namun fungsi paling khas cabang kardiak nervus vagus adalah menurunkan frekuensi denyut jantung (efek kronotropik negatif) melalui aksi pada nodus SA dan AV.","page":3,"image":null,"post":null,"status":"disputed","note":"Jawaban C di PDF bertentangan dengan fungsi utama nervus vagus. Dari pilihan yang ada, A secara fisiologi lebih tepat. Soal tetap ditampilkan, tetapi tidak dihitung dalam skor pasti.","term":"Rr. = rami, cabang saraf; nervus vagus = saraf parasimpatis kranial X.","topic":"Sistem saraf otonom","clue":"Bedakan saraf vagus parasimpatis dari saraf simpatis.","mental":"Vagus adalah pedal rem jantung, terutama menurunkan frekuensi lewat SA dan AV node.","choicesWhy":["Vagus menurunkan frekuensi jantung, sehingga pilihan ini lebih cocok secara fisiologi.","Vagus bukan pengatur utama vasodilatasi a. carotis communis.","Kunci PDF C kurang sesuai; efek vagus koroner tidak sesederhana vasokonstriksi primer.","Penurunan tekanan sistolik tidak merupakan efek langsung yang paling khas.","Ini mengulang definisi saraf parasimpatis, bukan efek fisiologis spesifik."],"flow":[]},{"id":"i12_2024-13","bank":"i12_2024","n":13,"q":"Efek Baylis pada filtrasi tekanan yang bekerja pada kapiler adalah…","options":["Tekanan onkotik kapiler","Integritas endothelial kapiler","Tekanan hidrostatik kapiler","Integritas lymphatic kapiler","Peningkatan permeabilitas kapiler"],"key":"C","why":"Rekap menghubungkan efek Bayliss, yaitu respons miogenik arteriola terhadap kenaikan tekanan, dengan perlindungan tekanan hidrostatik kapiler. Tekanan hidrostatik kapiler mendorong filtrasi ke interstisium.","page":3,"image":null,"post":null,"status":"fixed","note":"Efek Bayliss mengacu pada respons miogenik arteriola, bukan nama tekanan filtrasi itu sendiri.","term":"","topic":"Hemodinamika","clue":"Pisahkan respons Bayliss (miogenik arteriola) dari gaya filtrasi kapiler.","mental":"Arteriola menyempit saat tekanan naik untuk melindungi kapiler; tekanan hidrostatik kapiler sendiri mendorong filtrasi cairan.","choicesWhy":["Onkotik plasma menahan filtrasi, tetapi bukan yang disebut kunci sumber.","Integritas endotel memengaruhi permeabilitas, bukan tekanan dorong utama.","Tekanan hidrostatik kapiler adalah gaya yang mendorong filtrasi.","Aliran limfe menguras cairan interstisium, bukan tekanan hidrostatik kapiler.","Permeabilitas memengaruhi filtrasi, tetapi bukan nama tekanan yang ditanya."],"flow":[]},{"id":"uks1-1","bank":"uks1","n":1,"q":"Baroreseptor merupakan reseptor yang dapat mendeteksi perubahan tekanan di pembuluh darah. Apakah yang akan terjadi tekanan darah mengalami peningkatan?","options":["Baroreseptor mengalami peregangan","Baroreseptor berhenti bekerja","Baroreseptor mengalami perubahan bentuk","Potensial aksi dari sinus caroticus menurun","Potensial aksi dari arcus aorta menurun"],"key":"A","why":"Peningkatan tekanan arteri meregangkan dinding sinus karotikus dan arkus aorta, menaikkan firing baroreseptor. Tubuh kemudian dapat menurunkan aktivitas simpatis.","page":1,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Regulasi tekanan darah","clue":"Yang dideteksi baroreseptor adalah regangan dinding arteri.","mental":"Tekanan naik → dinding meregang → frekuensi tembakan baroreseptor meningkat.","choicesWhy":["Tekanan yang meningkat meregangkan dinding arteri dan merangsang baroreseptor.","Baroreseptor tidak berhenti bekerja ketika tekanan naik.","Perubahan bentuk memang terjadi sebagai bagian peregangan, tetapi A lebih tepat/spesifik.","Aktivitas aferen dari sinus karotikus meningkat, bukan menurun.","Aktivitas aferen dari arkus aorta meningkat, bukan menurun."],"flow":["Tekanan darah naik","Sinus karotikus/arkus aorta meregang","Firing baroreseptor naik","Simpatis turun & vagus naik"]},{"id":"uks1-2","bank":"uks1","n":2,"q":"Sesuai hukum Frank-Starling tentang kontraksi otot ventrikel, individu yang rajin berolahraga endurance akan memiliki kekuatan kontraksi ventrikel kiri yang besar. Komponen manakah yang meningkat jika kekuatan kontraksi ventrikel kiri meningkat?","options":["End-systolic Volume","Stroke Volume","Afterload","Preload","End-diastolic Volume"],"key":"B","why":"Dalam kisaran fisiologis, peregangan serat jantung dan peningkatan kekuatan kontraksi mendukung naiknya stroke volume. Stroke volume adalah EDV dikurangi ESV.","page":1,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Mekanika jantung","clue":"Fokus pada konsekuensi kekuatan ejeksi yang meningkat, bukan penyebabnya.","mental":"Kontraksi lebih kuat mendorong lebih banyak darah keluar tiap denyut, sehingga stroke volume meningkat.","choicesWhy":["Kekuatan ejeksi meningkat biasanya menurunkan ESV, bukan menaikkannya.","Volume sekuncup meningkat jika lebih banyak darah dipompa per denyut.","Afterload adalah beban melawan ejeksi, bukan akibat otomatis kontraksi kuat.","Preload berkaitan pengisian awal, bukan jawaban perubahan output.","EDV adalah volume akhir diastol dan dapat tidak berubah."],"flow":["EDV / regangan memadai","Kontraksi lebih kuat","ESV menurun","SV meningkat"]},{"id":"uks1-3","bank":"uks1","n":3,"q":"Mengapa pada saat melakukan pengukuran tekanan darah menggunakan sphygmomanometer dengan metode auskultasi, sphygmomanometer harus dipompa 30 mmHg lebih tinggi dibanding tekanan yang teraba saat pengukuran dengan palpatoir?","options":["Karena selisih sistolik dengan diastolik normal antara 20-40 mmHg","Karena tekanan sistolik auskultasi lebih tinggi dibanding palpasi","Karena telinga lebih peka membedakan tekanan dibanding ujung jari","Untuk menghindari bias dari bising lingkungan sekitar tempat pengukuran","Untuk menghindari auscultation gap"],"key":"E","why":"Memompa manset sekitar 20–30 mmHg di atas tekanan sistolik palpatoir membantu mengurangi risiko luputnya tekanan sistolik akibat auscultatory gap.","page":1,"image":null,"post":null,"status":"tentative","note":"PDF menyorot pilihan E dengan warna biru, yang menurut keterangan penutup berarti \"Belum fix\". Tidak dihitung sebagai kunci resmi yang pasti.","term":"Auscultatory gap = interval hilangnya bunyi Korotkoff sementara saat deflasi manset.","topic":"Pemeriksaan tekanan darah","clue":"Mengapa perkiraan sistolik melalui palpasi diperiksa sebelum auskultasi?","mental":"Auscultatory gap dapat membuat bunyi hilang sementara, sehingga perlu manset dipompa melewati tekanan sistolik yang diperkirakan.","choicesWhy":["Selisih 30 mmHg bukan diambil dari nilai pulse pressure normal.","Auskultasi sering memperkirakan tekanan sistolik secara lebih tepat, tetapi itu bukan alasan utama inflasi 30 mmHg.","Kepekaan telinga bukan alasan protokol.","Kebisingan ruangan perlu dikurangi, tetapi bukan alasan tambahan 30 mmHg.","Menghindari auscultatory gap yang berpotensi menghasilkan pembacaan sistolik salah."],"flow":["Estimasi sistolik palpasi","Pompa manset +30 mmHg","Turunkan perlahan","Cegah salah baca karena auscultatory gap"]},{"id":"uks1-4","bank":"uks1","n":4,"q":"Apakah fungsi apoB-100?","options":["Berikatan dengan scavenger receptor B1 (SR-B1)","Mengaktifkan enzim lipas lipoprotein","Mengaktifkan enzim lipase sensitive hormon","Berikatan dengan reseptor LDL","Mengaktifkan enzim lipase hepatic"],"key":"D","why":"ApoB-100 pada LDL menjadi ligan yang dikenali LDL receptor untuk penangkapan LDL oleh sel. ApoC-II yang mengaktivasi lipoprotein lipase.","page":1,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Lipoprotein","clue":"Jangan tertukar apolipoprotein yang mengikat reseptor dengan aktivator enzim.","mental":"ApoB-100 adalah label pengenal bagi LDL receptor; ApoC-II yang mengaktifkan LPL.","choicesWhy":["SR-B1 terutama berkaitan dengan pengambilan ester kolesterol dari HDL.","ApoC-II, bukan ApoB-100, mengaktifkan LPL.","HSL adalah enzim lipolisis adiposit, bukan target ApoB100.","ApoB-100 dikenali oleh LDL receptor.","ApoB-100 tidak berfungsi utama mengaktifkan hepatic lipase."],"flow":["VLDL → IDL → LDL","LDL membawa ApoB-100","LDL receptor mengikat","Partikel masuk sel"]},{"id":"uks1-5","bank":"uks1","n":5,"q":"Pada individu dewasa sehat, bagaimanakah perbandingan hasil pengukuran tekanan darah pada posisi berbaring dengan duduk apabila pengukuran dilakukan dengan jeda >5 menit?","options":["Keduanya hampir sama dengan selisih <10 mmHg","Berbaring lebih tinggi dibanding duduk dengan selisih >20 mmHg","Duduk lebih tinggi dibanding berbaring dengan selisih >20 mmHg","Tidak dapat diprediksi karena tergantung sensitifitas dan reaksi baroreseptor","Tidak dapat diprediksi karena tergantung pada volume dan viskositas darah"],"key":null,"why":"PDF tidak menyorot jawaban untuk nomor ini. Secara umum tekanan darah setelah istirahat dan posisi yang distandarkan tidak semestinya berubah besar hanya karena posisi, tetapi tidak ada ambang universal yang menjamin semua orang memiliki selisih <10 mmHg.","page":1,"image":null,"post":null,"status":"missing","note":"Tidak ada kunci berwarna pada PDF. Soal tidak dinilai agar tidak mengarang kunci.","term":"","topic":"Pemeriksaan tekanan darah","clue":"Soal membandingkan tekanan berbaring dan duduk pada dewasa sehat, tetapi tidak memberi kunci.","mental":"Barorefleks dapat menjaga tekanan darah relatif stabil antarposisi setelah tubuh beradaptasi.","choicesWhy":["Perbedaan umumnya kecil pada dewasa sehat setelah istirahat, tetapi tidak ada kunci sumber yang dipastikan.","Selisih >20 mmHg bukan karakteristik universal berbaring.","Selisih >20 mmHg bukan karakteristik universal duduk.","Barorefleks memengaruhi BP tetapi pembacaan dapat dibandingkan dalam kondisi baku.","Volume/viskositas bukan alasan utama menganggap selisih tak bisa diperkirakan."],"flow":[]},{"id":"uks1-6","bank":"uks1","n":6,"q":"Saat aliran darah sampai di kapiler, agar dapat terjadi pertukaran antara nutrisi, oksigen dan bahan lain yang dibawa plasma dengan sisa hasil metabolism sel, maka plasma harus didorong ke luar dari kapiler. Tekanan apakah yang berperan mendorong plasma keluar menuju ruang interstitial di kapiler?","options":["Tekanan arteri rerata","Tekanan osmotik kapiler","Tekanan darah sistolik","Tekanan negatif di ruang ventrikel kiri","Tekanan hidrostatik kapiler"],"key":"E","why":"Tekanan hidrostatik darah di kapiler mendorong cairan ke luar melalui filtrasi. Tekanan onkotik plasma bekerja berlawanan dengan mempertahankan cairan dalam pembuluh.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Pertukaran kapiler","clue":"Bayangkan gaya mana yang mendorong cairan keluar dinding kapiler.","mental":"Tekanan hidrostatik seperti dorongan air dari dalam selang; onkotik plasma cenderung menahan air di dalam.","choicesWhy":["Mean arterial pressure bukan komponen Starling kapiler yang langsung disebut.","Tekanan osmotik plasma justru menahan air di kapiler.","Sistolik tidak sama dengan tekanan lokal filtrasi mikrovaskular.","Tekanan ventrikel kiri bukan gaya filtrasi lokal kapiler.","Tekanan hidrostatik kapiler mendorong cairan ke interstisium."],"flow":["Tekanan hidrostatik kapiler","Cairan terdorong keluar","Masuk ruang interstisial","Limfe membantu mengembalikan ke sirkulasi"]},{"id":"uks1-7","bank":"uks1","n":7,"q":"Mengapa saat memeriksa tekanan darah secara auskultasi menggunakan sphygmomanometer, kita dapat mendengar bunyi Korotkoff di daerah arteri brakialis?","options":["Karena tekanan dari manset menyebabkan vasokontriksi arteri brakialis","Karena tekanan dari manset menyebabkan stetoskop menjadi lebih peka","Karena penyempitan pembuluh darah akibat dari manset menyebabkan terjadinya turbulensi pada aliran darah","Karena tekanan dari manset menyebabkan terjadinya peningkatan kekuatan penutupan katup-katup jantung","Karena tekanan dari manset menyebabkan kekuatan pompa jantung meningkat"],"key":"C","why":"Ketika tekanan manset turun di bawah sistolik tetapi masih di atas diastolik, aliran melalui arteri yang tertekan menjadi tidak stabil dan menimbulkan bunyi Korotkoff.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Pemeriksaan tekanan darah","clue":"Manset membuat pembuluh menyempit sebagian. Apa yang membuat bunyi?","mental":"Aliran yang menjadi tidak stabil melewati penyempitan menghasilkan bunyi Korotkoff.","choicesWhy":["Manset menekan secara mekanis, tidak harus menyebabkan vasokonstriksi aktif.","Stetoskop tidak bertambah sensitif karena manset.","Aliran tidak stabil/turbulen melalui segmen arteri tertekan menghasilkan bunyi Korotkoff.","Bunyi Korotkoff bukan bunyi katup jantung.","Manset tidak meningkatkan kekuatan pompa jantung."],"flow":["Manset menekan arteri","Tekanan manset turun","Aliran intermiten / tidak stabil","Bunyi Korotkoff terdengar"]},{"id":"uks1-8","bank":"uks1","n":8,"q":"Senyawa apakah yang menjadi substrat utama metabolism oksidatif di jantung pada kondisi setelah makan (postprandial state)?","options":["Glukosa","Benda keton","Asam amino","Asam lemak","Asam laktat"],"key":"A","why":"Dalam kondisi setelah makan, insulin dan ketersediaan glukosa meningkat; penggunaan glukosa oleh jantung bertambah, sedangkan oksidasi asam lemak relatif berkurang.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Metabolisme jantung","clue":"Petunjuknya postprandial, artinya setelah makan.","mental":"Sesudah makan glukosa dan insulin meningkat sehingga oksidasi glukosa jantung relatif meningkat.","choicesWhy":["Glukosa meningkat pascamakan dan dapat menjadi sumber oksidatif jantung yang lebih besar.","Keton lebih penting saat puasa/diabetes tertentu.","Asam amino bukan substrat utama pascamakan.","Asam lemak dominan pada aerobik basal, tetapi proporsi dapat turun setelah makan.","Laktat penting saat latihan, bukan jawaban utama pascamakan."],"flow":[]},{"id":"uks1-9","bank":"uks1","n":9,"q":"Di manakah muara vena saphena parva?","options":["V. femoralis","V. tibialis anterior","V. poplitea","V. saphena magna","V. tibialis posterior"],"key":"C","why":"Vena saphena parva umumnya berakhir di vena poplitea pada fossa poplitea di belakang lutut. Ada variasi anatomi terminasi vena ini.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Anatomi pembuluh","clue":"Ingat arah aliran vena superfisial tungkai posterior.","mental":"Vena saphena parva naik di sisi posterior tungkai menuju fossa poplitea dan bermuara ke v. poplitea.","choicesWhy":["Vena femoralis biasanya menerima saphena magna.","Vena tibialis anterior adalah vena dalam tungkai bawah.","Vena saphena parva umumnya berakhir pada vena poplitea.","Vena saphena magna adalah vena superfisial lain, bermuara ke femoralis.","Vena tibialis posterior adalah vena dalam tungkai, bukan muara klasik saphena parva."],"flow":[]},{"id":"uks1-10","bank":"uks1","n":10,"q":"Mengapa peristiwa kelistrikan saat fase plato dapat mencegah otot jantung mengalami tetani?","options":["Fase plato menyebabkan durasi kontraksi otot menjadi pendek","Saat fase plato sel otot jantung tidak dapat menerima rangsang listrik lain","Fase plato dapat menghemat energi untuk kontraksi otot jantung","Saat fase plato ambang kelistrikan membrane sel otot jantung menurun","Saat fase plato terjadi keseimbangan antara ion Na yang masuk sel dengan ion K yang keluar dari sel"],"key":"B","why":"Plateau action potential memperpanjang periode refrakter otot jantung. Akibatnya, rangsang baru tidak dapat segera memicu kontraksi tambahan dan tetanus tidak terjadi.","page":2,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Elektrofisiologi","clue":"Apa efek plateau terhadap refrakter miokard?","mental":"Fase plateau memperpanjang refrakter: kontraksi baru tidak bisa ditumpuk menjadi tetanus seperti otot rangka.","choicesWhy":["Plateau memperpanjang potensial aksi, bukan memendekkan kontraksi.","Plateau memperpanjang periode refrakter, mencegah penumpukan kontraksi tetanik.","Hemat energi bukan alasan utama pencegahan tetanus.","Ambang tidak sekadar turun; kanal Na cepat belum siap selama periode refrakter.","Plateau terutama melibatkan masuknya Ca2+ tipe-L yang menyeimbangkan arus K+ keluar, bukan Na+ saja."],"flow":["Depolarisasi","Plateau Ca²⁺","Refrakter panjang","Tidak terjadi tetanus"]},{"id":"uks1-11","bank":"uks1","n":11,"q":"Apa efek pemberian infus adrenalin pada sistem kardiovaskuler secara in vivo?","options":["Penurunan frekuensi denyut jantung","Penurunan tekanan darah sistolik","Penurunan tahanan perifer kapiler total","Penurunan volume sekuncup jantung","Penurunan kekuatan kontraksi otot jantung"],"key":"C","why":"Kunci sumber menandai berkurangnya tahanan perifer total, yang dapat terjadi bila efek vasodilatasi beta-2 dominan. Adrenalin juga memiliki efek beta-1 pada jantung dan alfa-1 pada pembuluh.","page":2,"image":null,"post":null,"status":"fixed","note":"Pengaruh adrenalin pada tahanan perifer dan tekanan darah bergantung dosis dan keseimbangan aktivasi alfa/beta. Pilihan C tidak berlaku untuk setiap kondisi infus.","term":"","topic":"Sistem saraf otonom","clue":"Epinefrin bekerja pada beberapa reseptor sekaligus, sehingga efek tergantung dosis.","mental":"β1 meningkatkan kerja jantung, β2 dapat melebarkan pembuluh otot, α1 dapat menyempitkan pembuluh.","choicesWhy":["Adrenalin cenderung meningkatkan denyut via β1, meski refleks dapat memodifikasi.","Adrenalin dapat menaikkan sistolik lewat stimulasi jantung.","Vasodilatasi beta-2 dapat menurunkan tahanan perifer pada dosis/konteks tertentu.","Stimulasi jantung biasanya meningkatkan SV, bukan menurunkannya langsung.","Adrenalin meningkatkan kontraktilitas via beta-1."],"flow":[]},{"id":"uks1-12","bank":"uks1","n":12,"q":"Pada perkembangan jantung hari ke-18, di manakah letak angiogenic cell cluster terhadap brain plate?","options":["Posterior dan caudal","Superior dan posterior","Medial dan inferior","Anterior dan lateral","Caudal dan superior"],"key":"D","why":"Kelompok sel angiogenik awal muncul di area kardiogenik bagian kranial dan lateral terhadap lempeng neural/brain plate sesuai diagram embriologi tahap awal.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Embriologi","clue":"Ini embriologi hari 18, bukan anatomi jantung dewasa.","mental":"Area kardiogenik awal berada kranial dan lateral terhadap lempeng neural pada cakram embrio yang sedang berkembang.","choicesWhy":["Posterior-kaudal tidak sesuai orientasi area kardiogenik awal.","Superior-posterior kurang menggambarkan penempatan lateral.","Medial-inferior berlawanan penempatan area mesoderm splanchnic kranial/lateral.","Area kardiogenik pada tahap awal menempati area anterior (kranial) dan lateral.","Caudal-superior adalah kombinasi orientasi yang tidak tepat untuk maksud soal."],"flow":[]},{"id":"uks1-13","bank":"uks1","n":13,"q":"Vasa darah manakah di bawah ini yang bermuara pada atrium sinistrum?","options":["Vena cava inferior","Venae pulmonales","Venae minimae cordis","Vena cava superior","Sinus coronarius"],"key":"B","why":"Venae pulmonales membawa darah dari paru menuju atrium sinistrum. Vena kava dan sinus koronarius umumnya bermuara ke atrium dextrum.","page":3,"image":null,"post":null,"status":"fixed","note":"","term":"","topic":"Anatomi jantung","clue":"Cari pembuluh yang membawa darah dari paru ke serambi kiri.","mental":"Empat vena pulmonalis membawa darah beroksigen ke atrium sinistrum.","choicesWhy":["Vena cava inferior masuk ke atrium kanan.","Vena pulmonalis masuk ke atrium kiri.","Venae cordis minimae bermuara langsung ke beberapa ruang jantung, bukan vena masuk utama atrium kiri yang ditanyakan.","Vena cava superior masuk atrium kanan.","Sinus coronarius bermuara ke atrium kanan."],"flow":["Paru","Venae pulmonales","Atrium sinistrum","Valva mitralis → ventrikel sinistrum"]},{"id":"uks1-14","bank":"uks1","n":14,"q":"Apa yang menyebabkan sel endotel yang mengalami injuri menjadi lebih trombogenik dibandingkan dengan sel endotel normal?","options":["PGI2 normal dan NO normal","Menurunnya PGI2 dan menurunnya NO","Meningkatkan PGI2 dan meningkatnya NO","Meningkatnya PGI2 dan menurunnya NO","Menurunnya PGI2 dan meningkatnya NO"],"key":null,"why":"Endotel sehat menghasilkan prostasiklin (PGI2) dan nitric oxide (NO) untuk menghambat agregasi trombosit dan membantu vasodilatasi. Penurunan keduanya mengurangi sifat antitrombotik.","page":3,"image":null,"post":null,"status":"missing","note":"PDF tidak menunjukkan sorotan pilihan untuk nomor 14. Pembahasan konsep ini bukan penetapan kunci resmi.","term":"","topic":"Endotelium","clue":"Cedera endotel merusak sistem antitrombotik pelapis pembuluh.","mental":"NO dan PGI2 biasanya menghambat agregasi trombosit. Jika keduanya turun, trombosis lebih mudah terjadi.","choicesWhy":["NO dan PGI2 normal tidak menjelaskan peningkatan trombogenisitas.","Penurunan keduanya membuat permukaan endotel kurang antitrombotik.","Peningkatan keduanya memperkuat perlindungan terhadap trombosit.","PGI2 naik akan cenderung melindungi, meskipun NO turun.","NO naik membantu antitrombotik, meskipun PGI2 turun."],"flow":[]},{"id":"uks1-15","bank":"uks1","n":15,"q":"Apakah fungsi baroreseptor yang ada di dinding pembuluh darah?","options":["Merupakan tempat keluarnya saraf simpatis yang akan mempercepat frekuensi denyut jantung","Menerima informasi mengenai perubahan tekanan darah","Mendeteksi perubahan komposisi darah","Sebagai efektor saraf eferen dari medula oblongata","Mengatur tinggi rendah tekanan darah"],"key":"B","why":"Baroreseptor mendeteksi peregangan dinding arteri akibat perubahan tekanan darah, lalu mengirim impuls aferen ke pusat kardiovaskular di batang otak.","page":3,"image":null,"post":null,"status":"tentative","note":"Jawaban B diberi warna biru (\"Belum fix\") pada PDF. Secara istilah lebih tepat baroreseptor mendeteksi perubahan tekanan/peregangan daripada sekadar menerima informasi.","term":"","topic":"Regulasi tekanan darah","clue":"Apa yang dipantau baroreseptor, bukan kemoreseptor?","mental":"Baroreseptor membaca regangan/tekanan. Kemoreseptor membaca O2, CO2 dan pH.","choicesWhy":["Baroreseptor adalah sensor aferen, bukan asal saraf simpatis eferen.","Mendeteksi perubahan regangan/tekanan dan meneruskan informasi ke pusat regulasi.","Komposisi gas darah lebih tepat untuk kemoreseptor.","Bukan efektor eferen, melainkan sensor aferen.","Pusat pengaturan tekanan mencakup otak dan banyak efektor; baroreseptor sendiri sensor."],"flow":[]},{"id":"uks1-16","bank":"uks1","n":16,"q":"Pada proses perkembangan jantung, terjadi pada hari keberapakah proses bending jantung telah secara komplit?","options":["35","30","25","20","15"],"key":"A","why":"PDF menyorot hari 35 sebagai kunci. Namun rangkaian heart looping berlangsung sekitar minggu keempat embriogenesis, dengan banyak rujukan menyebut looping utama selesai sekitar hari 28.","page":3,"image":null,"post":null,"status":"fixed","note":"Angka 35 pada kunci PDF perlu diverifikasi dengan bahan kuliah/dosen karena tahapan looping sering diletakkan pada hari sekitar 23–28. Jangan menganggap angka 35 sebagai aturan universal.","term":"","topic":"Embriologi","clue":"Bending adalah heart looping pada minggu keempat, lihat kronologi.","mental":"Looping tabung jantung berlangsung terutama hari 23-28, meski kunci dokumen menandai 35.","choicesWhy":["Sumber memilih 35 hari, tetapi literatur membahas looping utama terutama minggu keempat.","Hari 30 masih dekat akhir minggu keempat, tetapi bukan kunci ditandai.","Hari 25 merupakan tahap looping aktif dalam sumber lain.","Hari 20 terlalu dini untuk penyelesaian looping.","Hari 15 sebelum tahapan tabung jantung berkembang."],"flow":[]},{"id":"uks1-17","bank":"uks1","n":17,"q":"Pada saat darah mengalir dari atrium ke ventriculus (fase diastolik), apa yang terjadi pada struktur bertanda bintang?","options":["Kontraksi","Tegang","Melipat","Relaksasi","Mengendur"],"key":"E","why":"Bintang berada pada struktur terkait otot papiler. Saat pengisian ventrikel, otot papiler dalam keadaan relaksasi/mengendur bersama miokardium ventrikel.","page":3,"image":"papillary_stars_uk","post":null,"status":"tentative","note":"PDF memberi warna biru (\"Belum fix\") pada opsi E. Istilah relaksasi pada opsi D sangat dekat maknanya, sehingga butuh klarifikasi soal untuk membedakan keduanya.","term":"","topic":"Mekanika jantung","clue":"Gambar bertanda bintang adalah struktur berkaitan dengan dinding ventrikel dan otot papiler.","mental":"Diastol adalah periode relaksasi ventrikel sehingga darah dapat mengalir dari atrium ke ventrikel.","choicesWhy":["Saat pengisian ventrikel, otot papiler biasanya tidak dalam kontraksi sistolik.","Tegang adalah keadaan berlawanan dengan relaksasi yang dituju.","Melipat bukan keadaan otot yang relevan.","Relaksasi secara fisiologis dekat arti dengan mengendur, sehingga opsi bersinggungan.","Ini pilihan biru yang ditandai sumber, artinya mengendur pada diastol."],"flow":[]},{"id":"uks1-18","bank":"uks1","n":18,"q":"Sel yang ditunjuk menyimpan energinya di dalam cyroplasma. Dalam bentuk apakah simpanan energi tersebut?","options":["Glikolipid","Glikogen","Protein","Lipid","Glukosa"],"key":"B","why":"Sel konduksi Purkinje dapat menyimpan glikogen dalam sitoplasma sehingga tampak lebih pucat dibanding kardiomiosit kontraktil pada preparat histologi.","page":4,"image":"cardiomyocyte_histology","post":null,"status":"fixed","note":"","term":"Cytoplasma = bagian sel di luar nukleus; glikogen = bentuk simpanan glukosa.","topic":"Histologi jantung","clue":"Sel Purkinje kaya glikogen. Cari granula penyimpan gula.","mental":"Glikogen adalah bentuk gudang glukosa di sitoplasma sel konduksi, membuat sitoplasmanya tampak lebih pucat.","choicesWhy":["Glikolipid bukan bentuk simpanan energi klasik Purkinje.","Glikogen tersimpan sebagai granula dalam sitoplasma sel konduksi.","Protein terutama bukan bentuk simpanan energi utama sel ini.","Lipid dapat disimpan beberapa sel, tetapi bukan ciri Purkinje pada preparat.","Glukosa bebas tidak merupakan bentuk penyimpanan stabil dalam jumlah besar."],"flow":["Sel Purkinje","Glikogen dalam sitoplasma","Warna sitoplasma pucat pada histologi"]},{"id":"uks1-19","bank":"uks1","n":19,"q":"Mengapa struktur yang dilingkari dijumpai pada vasa sanguinea besar?","options":["Membantu kontraksi","Memproduksi hormon","Distribusi nutrisi","Deteksi tekanan darah","Meneruskan transmisi impuls"],"key":"C","why":"Struktur yang dilingkari adalah vasa vasorum, pembuluh darah kecil di dinding pembuluh besar. Struktur ini membantu menyalurkan oksigen dan nutrisi ke lapisan dinding yang terlalu tebal untuk memperoleh semuanya lewat difusi dari lumen.","page":4,"image":"vasa_vasorum_circles","post":null,"status":"fixed","note":"","term":"","topic":"Histologi vaskular","clue":"Mengapa dinding pembuluh besar membutuhkan pembuluh darah tambahan?","mental":"Difusi dari lumen tak cukup mencapai lapisan luar dinding tebal, sehingga vasa vasorum memberi oksigen/nutrisi.","choicesWhy":["Vasa vasorum bukan penggerak kontraksi otot vaskular.","Tidak bertugas memproduksi hormon.","Vasa vasorum mendistribusikan nutrisi dan oksigen pada dinding pembuluh besar.","Baroreseptor adalah reseptor tekanan yang berbeda struktur.","Jaringan saraflah yang membawa impuls, bukan vasa vasorum."],"flow":["Dinding pembuluh besar","Difusi dari lumen tidak cukup","Vasa vasorum","Nutrisi untuk dinding luar"]},{"id":"uks1-20","bank":"uks1","n":20,"q":"Komponen apakah yang bereaksi positif dengan zat pewarna dan terwarnai hitam (ditunjuk panah kuning)?","options":["Fibra elastica","Fibra reticularis","Glycosaminoglycan","Myocytus levis","Fibra collageni"],"key":"A","why":"Pewarnaan Verhoeff (hematoxylin Verhoeff) menonjolkan serat elastik menjadi hitam. Fibra elastica membantu sifat elastis pembuluh darah.","page":4,"image":"verhoeff_fiber","post":null,"status":"fixed","note":"","term":"","topic":"Histologi vaskular","clue":"Pewarna Verhoeff hitam digunakan untuk komponen apa?","mental":"Serat elastin di dinding arteri tampak gelap/hitam dengan pewarna elastik tertentu.","choicesWhy":["Serat elastik menjadi gelap atau hitam dengan pewarnaan Verhoeff.","Retikular bisa ditonjolkan dengan pewarnaan perak tertentu.","Glikosaminoglikan lazim tampak dengan pewarnaan lain seperti Alcian blue.","Sel otot polos tidak berwarna hitam spesifik karena Verhoeff elastin.","Kolagen sering tampak dengan trikrom, bukan target utama Verhoeff."],"flow":[]},{"id":"uks1-21","bank":"uks1","n":21,"q":"Pada suatu jaringan yang diwarnai hematoxillin-eosin dan diamati dengan mikroskop cahaya tampak sebuah vasa dengan lumen sempit bulat disertai satu nucleus pipih di dekat lumen, dan dua nucleus oval di lapisan berikutnya. Vasa tipe manakah yang sedang diamati?","options":["Arteri","Vas capillare","Venula","Vena","Arteriola"],"key":"E","why":"Arteriola memiliki endotel yang melapisi lumen serta sekitar satu sampai dua lapis sel otot polos pada tunika media, sering tampak sebagai inti oval di luar endotel.","page":4,"image":null,"post":null,"status":"tentative","note":"Pilihan E diberi sorotan biru (\"Belum fix\") di PDF. Bentuk dan tebal lapisan sel mendukung arteriola, namun interpretasi optimal memerlukan foto preparat yang tidak disertakan dalam pertanyaan ini.","term":"","topic":"Histologi vaskular","clue":"Hitung jumlah lapisan otot polos di sekitar lumen yang dibatasi endotel.","mental":"Arteriola kecil memiliki lapisan endotel dan 1 sampai 2 lapis otot polos; kapiler hanya endotel dan perisit.","choicesWhy":["Arteri besar memiliki tunika media lebih banyak daripada dua lapis otot.","Kapiler hanya lapisan endotel/perisit, tanpa dua lapis otot polos.","Venula tidak secara khas mempunyai satu hingga dua lapis otot polos konsentris dengan lumen bundar.","Vena memiliki lapisan dinding dan lumen yang cenderung lebih luas/ireguler.","Arteriola mempunyai endotel dan sekitar 1-2 lapis otot polos."],"flow":[]},{"id":"uks1-22","bank":"uks1","n":22,"q":"Pertukaran molekul antara alveoli dan vas capillare antara lain menggunakan cara difusi sederhana. Selain O2 dan CO2, molekul apakah yang dapat melewati membrane plasma dengan cara difusi sederhana tersebut?","options":["H+","N2","Na+","H2O","HCO3-"],"key":"B","why":"N2 bersifat kecil dan nonpolar sehingga dapat melintasi lipid bilayer lewat difusi sederhana. Ion bermuatan seperti H+ dan Na+ memerlukan kanal/transporter.","page":4,"image":null,"post":null,"status":"fixed","note":"","term":"Difusi sederhana = perpindahan sesuai gradien tanpa ATP dan tanpa protein pengangkut khusus.","topic":"Transport membran","clue":"Difusi sederhana mudah bagi molekul kecil nonpolar, sulit untuk ion.","mental":"N2 seperti O2 mudah melintasi bilayer lipid. Ion bermuatan perlu jalur protein.","choicesWhy":["H+ bermuatan dan tidak bebas lewat bilayer lipid.","N2 kecil dan nonpolar sehingga dapat berdifusi langsung.","Na+ bermuatan dan membutuhkan kanal/transporter.","Air dapat lewat bilayer sebagian, tetapi banyak lewat aquaporin; soal menargetkan gas nonpolar.","HCO3- adalah ion bermuatan dan butuh jalur khusus."],"flow":[]},{"id":"uks1-23","bank":"uks1","n":23,"q":"Berdasarkan hukum Frank-Starling, apa efek dari peningkatan end-diastolic volume?","options":["Penurunan preload","Peningkatan preload","Peningkatan heart rate","Penurunan cardiac output","Peningkatan cardiac output"],"key":"B","why":"Kenaikan EDV meningkatkan pengisian dan regangan awal ventrikel, yaitu preload. Dalam kisaran fisiologis ini biasanya juga meningkatkan stroke volume melalui mekanisme Frank–Starling.","page":5,"image":null,"post":null,"status":"fixed","note":"Pilihan E dapat menjadi akibat lanjutan bila heart rate tidak turun, tetapi efek yang paling langsung terhadap parameter yang ditanyakan adalah peningkatan preload.","term":"","topic":"Mekanika jantung","clue":"EDV adalah volume akhir pengisian sebelum ventrikel berkontraksi.","mental":"Lebih banyak darah masuk → regangan awal serat meningkat → preload naik → SV biasanya naik dalam rentang fisiologis.","choicesWhy":["EDV naik umumnya menaikkan preload, bukan menurunkannya.","EDV yang meningkat langsung mencerminkan preload lebih tinggi.","Heart rate tidak otomatis naik karena EDV.","CO sering meningkat dalam kisaran fisiologis, tidak otomatis turun.","CO dapat meningkat kemudian, tetapi yang langsung berubah adalah preload."],"flow":["Venous return naik","EDV naik","Preload naik","Kontraksi & SV biasanya naik"]}],"summary":{"total":58,"bankCounts":{"i11":10,"i12":12,"i12_2024":13,"uks1":23}},"cards":[{"id":"card-1","front":"Atria","back":"Bentuk jamak dari atrium. Satu atrium, dua atria.","topic":"Terminologi"},{"id":"card-2","front":"Periosteum","back":"Selaput jaringan ikat yang membungkus tulang bagian luar, mendukung pertumbuhan appositional dan perbaikan fraktur.","topic":"Osteologi"},{"id":"card-3","front":"Hematopoiesis","back":"Proses pembentukan sel darah, pada dewasa terutama di sumsum tulang merah.","topic":"Osteologi"},{"id":"card-4","front":"Textus epithelialis","back":"Jaringan epitel, tersusun rapat dengan matriks ekstraseluler relatif sedikit.","topic":"Histologi dasar"},{"id":"card-5","front":"Diafisis","back":"Batang panjang di tengah tulang panjang.","topic":"Osteologi"},{"id":"card-6","front":"ATP","back":"Mata uang energi yang langsung digunakan myosin dan banyak mesin sel.","topic":"Bioenergetika"},{"id":"card-7","front":"SR-B1","back":"Reseptor pemulung hati yang mengambil ester kolesterol dari HDL.","topic":"Lipoprotein"},{"id":"card-8","front":"ApoB-100","back":"Apoprotein struktural LDL/VLDL yang dikenali LDL receptor.","topic":"Lipoprotein"},{"id":"card-9","front":"ApoC-II","back":"Pengaktif enzim lipoprotein lipase (LPL).","topic":"Lipoprotein"},{"id":"card-10","front":"IDL","back":"Produk hidrolisis VLDL oleh LPL. Dapat diambil hati atau menjadi LDL.","topic":"Lipoprotein"},{"id":"card-11","front":"SGLT","back":"Kotransporter glukosa bersama Na+ yang memakai gradien Na+; transpor aktif sekunder.","topic":"Transport membran"},{"id":"card-12","front":"Sinus venosus","back":"Asal bagian halus posterior atrium kanan (sinus venarum).","topic":"Embriologi"},{"id":"card-13","front":"Bulbus cordis / conus cordis","back":"Berkontribusi pada jalur keluar halus ventrikel.","topic":"Embriologi"},{"id":"card-14","front":"Ductus venosus","back":"Jalan pintas darah janin yang menjadi ligamentum venosum.","topic":"Sirkulasi fetal"},{"id":"card-15","front":"Ductus arteriosus","back":"Hubungan arteri pulmonalis dengan aorta janin; menjadi ligamentum arteriosum.","topic":"Sirkulasi fetal"},{"id":"card-16","front":"Vena pulmonalis","back":"Pembuluh yang membawa darah beroksigen dari paru ke atrium kiri.","topic":"Anatomi jantung"},{"id":"card-17","front":"Reseptor β1","back":"Reseptor utama simpatis di jantung; meningkatkan denyut dan kontraktilitas.","topic":"Sistem saraf otonom"},{"id":"card-18","front":"Reseptor β2","back":"Dapat menimbulkan vasodilatasi pada pembuluh otot rangka.","topic":"Sistem saraf otonom"},{"id":"card-19","front":"Nervus vagus","back":"Saraf parasimpatis yang umumnya memperlambat denyut jantung.","topic":"Sistem saraf otonom"},{"id":"card-20","front":"Pacemaker phase 4","back":"Depolarisasi spontan menuju threshold. Simpatis membuat kemiringannya lebih curam.","topic":"Elektrofisiologi"},{"id":"card-21","front":"Plateau potensial aksi","back":"Periode arus Ca2+ masuk yang memanjangkan refrakter sehingga mencegah tetanus.","topic":"Elektrofisiologi"},{"id":"card-22","front":"Frank-Starling","back":"Semakin besar filling/EDV dalam rentang fisiologis, serat lebih teregang dan SV biasanya meningkat.","topic":"Mekanika jantung"},{"id":"card-23","front":"Preload","back":"Regangan/beban awal serat ventrikel sebelum kontraksi, berkaitan dengan EDV.","topic":"Mekanika jantung"},{"id":"card-24","front":"Stroke volume","back":"Volume darah yang dipompa satu ventrikel tiap denyut. SV = EDV - ESV.","topic":"Mekanika jantung"},{"id":"card-25","front":"Hipertrofi konsentrik","back":"Penebalan dinding ventrikel yang sering merespons overload tekanan, misalnya stenosis aorta.","topic":"Penyakit jantung"},{"id":"card-26","front":"Baroreseptor","back":"Sensor regangan tekanan di sinus karotikus dan arkus aorta.","topic":"Regulasi tekanan darah"},{"id":"card-27","front":"Renin","back":"Enzim dari sel jukstaglomerular ginjal yang memulai RAAS.","topic":"Regulasi tekanan darah"},{"id":"card-28","front":"Hydrostatic pressure","back":"Tekanan yang mendorong cairan keluar kapiler menuju interstisium.","topic":"Pertukaran kapiler"},{"id":"card-29","front":"Auscultatory gap","back":"Periode bunyi Korotkoff yang menghilang sementara dan bisa menyebabkan salah membaca sistolik.","topic":"Pemeriksaan tekanan darah"},{"id":"card-30","front":"Vena saphena parva","back":"Vena superfisial posterior tungkai yang umumnya bermuara ke v. poplitea.","topic":"Anatomi pembuluh"},{"id":"card-31","front":"Vasa vasorum","back":"Pembuluh darah kecil yang menutrisi lapisan dinding pembuluh besar.","topic":"Histologi vaskular"},{"id":"card-32","front":"Arteriola","back":"Pembuluh resistensi kecil dengan tunika media 1-2 lapis otot polos.","topic":"Histologi vaskular"},{"id":"card-33","front":"Serat elastik dengan Verhoeff","back":"Serat elastik umumnya berwarna hitam pada preparat Verhoeff.","topic":"Histologi vaskular"},{"id":"card-34","front":"Sel Purkinje","back":"Kardiomiosit konduksi lebih besar dan relatif pucat karena banyak glikogen.","topic":"Histologi jantung"},{"id":"card-35","front":"Foam cell","back":"Makrofag mengandung lipid yang merupakan ciri fatty streak aterosklerosis.","topic":"Aterosklerosis"},{"id":"card-36","front":"Fibrous cap rentan","back":"Cenderung tipis, kaya sel inflamasi/makrofag dan memiliki proteksi jaringan kolagen lemah.","topic":"Penyakit koroner"}]}</script>
