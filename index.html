<script>
'use strict';
const DATA=JSON.parse(document.getElementById('quiz-data').textContent);
const ASSETS=JSON.parse(document.getElementById('asset-data').textContent);
const BUNDLE=false;
const Q=DATA.questions;
const BANKS=DATA.banks;
const CARDS=DATA.cards;
const ALL_IDS=Q.map(x=>x.id);
const KEY='sela_cumex_v1';
const mapQ=Object.fromEntries(Q.map(x=>[x.id,x]));
const glyph={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',layers:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/>',check:'<path d="m5 12 4 4L19 6"/>',flash:'<rect x="3" y="3" width="14" height="18" rx="2"/><path d="M7 8h6M7 12h6"/><path d="M18 8h3v11a2 2 0 0 1-2 2h-2"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20V8"/>',settings:'<path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M3 12h3m12 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',left:'<path d="m14 18-6-6 6-6"/>',right:'<path d="m10 18 6-6-6-6"/>',book:'<path d="M4 4c3-2 6-2 8 0 2-2 5-2 8 0v16c-3-2-6-2-8 0-2-2-5-2-8 0zM12 4v16"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',flag:'<path d="M5 3v18M5 4c4-3 8 3 14 0v10c-6 3-10-3-14 0"/>',bookmark:'<path d="M5 4h14v17l-7-5-7 5z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',alert:'<path d="m12 3 10 18H2z"/><path d="M12 9v5M12 18h.01"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-5 5 5-5 5 5M4 7V3h16v4"/>',rotate:'<path d="M3 11a9 9 0 1 1 2 7M3 3v8h8"/>',plus:'<path d="M12 5v14M5 12h14"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M5 5 19 19M19 5 5 19"/>',graduation:'<path d="m2 10 10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5M22 10v7"/>'};
function ico(name,size=18){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyph[name]||glyph.info}</svg>`}
function safe(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function pct(a,b){return b?Math.round(100*a/b):0}
function fmtNum(v){return String(v).padStart(2,'0')}
function getBank(id){return BANKS.find(x=>x.id===id)}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==='object'?v:{}}catch(_){return {}}}
let saved=load();
let st={view:'home',bank:'i12',queue:[],at:0,preview:0,exam:null,flowSeen:{},flashIndex:0,flashFlipped:false,flashFilter:'due',search:'',filterBank:'all',filterTopic:'all',sidebarOpen:false,lightbox:null,...saved};
if(!st.progress||typeof st.progress!=='object')st.progress={};
if(!st.marks||typeof st.marks!=='object')st.marks={};
if(!st.cards||typeof st.cards!=='object')st.cards={};
if(!Array.isArray(st.queue))st.queue=[];
if(!['home','quiz','results','library','cards','settings','exam_setup'].includes(st.view))st.view='home';
if(!st.exam||typeof st.exam!=='object'||!Array.isArray(st.exam.ids))st.exam=null;
let toastTimer;
function persist(){const clone={...st};delete clone.lightbox;delete clone.sidebarOpen;try{localStorage.setItem(KEY,JSON.stringify(clone))}catch(_){}}
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800)}
function completion(bid){let arr=Q.filter(x=>x.bank===bid);return {done:arr.filter(x=>st.progress[x.id]?.checked).length,total:arr.length}}
function allProgress(){return Q.filter(x=>st.progress[x.id]?.checked).length}
function bankChip(b){const c=completion(b.id);return `<button class="deckcard" data-act="bank" data-bank="${b.id}"><div class="decktop"><span class="deckserial">${safe(b.short)}</span><span class="roundArrow">${ico('arrow',17)}</span></div><div class="decktitle">${safe(b.title)}</div><div class="deckdesc">${safe(b.about)}</div><div class="deckbottom"><b>${c.done}/${c.total} diperiksa</b><span class="thinbar"><b style="width:${pct(c.done,c.total)}%"></b></span></div></button>`}
function shell(main){let pc=allProgress();return `<div class="layout"><aside class="side ${st.sidebarOpen?'open':''}" id="sidebar"><div class="brand"><div class="brandmark">${ico('book',23)}</div><div><div class="brandtitle">sela.</div><div class="brandsub">CUMEX PRACTICE</div></div></div><div class="sidegroup">Belajar</div><div class="nav">${navbtn('home','home','Beranda')}${navbtn('layers','library','Bank soal')}${navbtn('check','exam_setup','Simulasi ujian')}${navbtn('flash','cards','Flashcard')}${navbtn('chart','results','Hasil latihan')}</div><div class="sidegroup">Lainnya</div><div class="nav">${navbtn('settings','settings','Pengaturan')}</div><div class="sidebottom"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>Progres latihan</strong><span style="font-size:12px;font-weight:760">${pc}/58</span></div><p>Setiap soal menyimpan jawaban sesudah diperiksa.</p><div class="sideprog"><i style="width:${pct(pc,58)}%"></i></div></div></aside><div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="btn ghost sm icononly mobilemenu" aria-label="Menu" data-act="menu">${ico('menu',18)}</button><div class="topcrumb"><span>SELA</span><span>/</span><strong>${st.view==='quiz'?'Latihan soal':st.view==='cards'?'Kartu hafalan':st.view==='library'?'Bank soal':st.view==='results'?'Hasil':st.view==='settings'?'Pengaturan':st.view==='exam_setup'?'Simulasi':'Beranda'}</strong></div></div><div class="topactions"><span class="miniindicator">${pc} dari 58 diperiksa</span><button class="btn ghost sm" data-act="goto" data-view="cards">${ico('flash',15)} <span>Flashcard</span></button></div></header>${main}</div></div>${st.lightbox?`<div class="overlay" data-act="closeimg"><button aria-label="Tutup gambar">×</button><img src="${ASSETS[st.lightbox]}" alt="Gambar soal diperbesar"></div>`:''}`}
function navbtn(icon,view,label){const a=(st.view===view||(view==='library'&&st.view==='quiz'))?' active':'';return `<button class="navbtn${a}" data-act="goto" data-view="${view}">${ico(icon)} ${safe(label)}</button>`}
function linkBank(b){return `${safe(b.short)} · ${Q.filter(q=>q.bank===b.id).length} soal`}
function home(){let next=BANKS.find(b=>completion(b.id).done<completion(b.id).total)||BANKS[0];return `<main class="view"><div class="hero"><div><div class="eyebrow">Latihan berbasis empat dokumen</div><h1 class="display">Coba dulu.<br><em>Periksa setelahnya.</em></h1><p class="lede">Kunci jawaban tidak tampil saat kamu mengerjakan. Setelah menekan <strong>Periksa jawaban</strong>, kamu mendapat pembahasan yang menjelaskan logika soal dan setiap pilihan.</p><div class="statrow"><span class="smallstat">${ico('layers',16)} <b>4</b> kumpulan</span><span class="smallstat">${ico('check',16)} <b>58</b> soal sumber</span><span class="smallstat">${ico('flash',16)} <b>${CARDS.length}</b> kartu</span></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" data-act="bank" data-bank="${next.id}">Mulai ${safe(next.short)} ${ico('arrow')}</button><button class="btn ghost" data-act="goto" data-view="exam_setup">Simulasi ujian</button></div></div><div class="heroStats"><span>Soal tersedia</span><div class="bigNumber">58</div><footer>Gambar asli ada pada soal yang memerlukannya.<div class="animatedDots" aria-hidden="true" style="margin-top:11px"><i></i><i></i><i></i></div></footer></div></div><div class="sectiontop"><div><div class="eyebrow">Pilih paket</div><h2 class="sectiontitle">Empat kumpulan latihan</h2></div><span class="sectionmeta">Kamu bisa berpindah kapan saja</span></div><div class="deckGrid">${BANKS.map(bankChip).join('')}</div><div class="sectiontop"><h2 class="sectiontitle">Sebelum mulai</h2></div><div class="notice">${ico('info',19)}<p><b>Tidak semua kunci pada PDF sudah pasti.</b> Terdapat 50 soal dengan kunci sumber yang ditandai, 4 kunci tentatif, 2 soal tanpa kunci, dan 2 soal dengan kunci yang bertentangan dengan konsep. Soal terakhir tetap bisa dicoba tetapi tidak dihitung sebagai nilai pasti.</p></div><div class="nextcard"><div><strong>Perlu mengulang konsep?</strong><p>Flashcard tersedia untuk hafalan cepat dan diulang sesuai tanggal belajar.</p></div><button class="btn soft" data-act="goto" data-view="cards">Buka flashcard ${ico('arrow',16)}</button></div><div class="footer">Sumber: empat PDF Cumex Blok I.1 dan I.2 yang kamu unggah. Materi pembahasan adalah alat belajar mandiri, bukan pengganti bahan resmi dosen.</div></main>`}
function practiceIds(){return st.queue.filter(id=>!!mapQ[id])}
function activeExam(){return st.exam?.active&&st.exam?.ids?.length>0}
function currentData(){let ex=activeExam(),ids=ex?st.exam.ids:practiceIds(),i=ex?st.exam.at:st.at;return {ex,ids,i:Math.min(Math.max(0,i),Math.max(ids.length-1,0)),q:mapQ[ids[i]]}}
function selection(q,ex){return ex?st.exam.picks[q.id]||'':st.progress[q.id]?.choice||''}
function isChecked(q,ex){return ex?!!st.exam.reviewed:!!st.progress[q.id]?.checked}
function itemImage(q){if(!q.image||!ASSETS[q.image])return '';return `<button class="sourceImage" data-act="zoom" data-img="${q.image}" aria-label="Perbesar gambar soal"><img loading="lazy" alt="Gambar asli soal ${safe(q.id)} dari PDF, tanpa pembahasan" src="${ASSETS[q.image]}"><figcaption>Gambar pada soal asli · ketuk untuk memperbesar ${ico('search',12)}</figcaption></button>`}
function quiz(){let {ex,ids,i,q}=currentData();if(!q)return `<main class="view"><div class="empty"><h3>Belum ada soal dalam sesi ini</h3><button class="btn" data-act="goto" data-view="home">Kembali ke beranda</button></div></main>`;let review=isChecked(q,ex),pick=selection(q,ex),bank=getBank(q.bank);let checkedCount=ex?(st.exam.reviewed?ids.length:Object.keys(st.exam.picks).filter(id=>st.exam.picks[id]).length):ids.filter(id=>st.progress[id]?.checked).length;const isExam=ex&&!st.exam.reviewed;let correctDisplay=review&&q.status==='fixed'&&pick===q.key;let showMarks=!ex&&!!st.marks[q.id];let timing=ex?`<span>${ico('clock',15)} Simulasi ujian</span>`:'';return `<main class="view narrow"><div class="quizhead"><div><div class="quizeyebrow">${isExam?'Mode simulasi tanpa koreksi langsung':st.mode==='review'?'Latihan ulang soal salah':'Latihan dengan koreksi langsung'}</div><h1 class="quiztitle">${ex?'Simulasi Cumex':safe(bank.title)}</h1><div class="quizsub">${isExam?'Kunci dan pembahasan akan muncul setelah sesi selesai.':`${safe(bank.subtitle)} · ${safe(bank.range)}`}</div></div><div style="display:flex;gap:8px;align-items:center"><button class="btn ghost sm" data-act="goto" data-view="home">Keluar sesi</button><button class="btn ghost sm icononly" data-act="mark" data-id="${q.id}" title="Simpan soal untuk diulang" aria-label="Simpan soal">${ico('bookmark',16)}</button></div></div><div class="quizgrid"><section class="questionPaper"><div class="questionTop"><span class="questionCounter">${safe(q.bank==='uks1'?'UK Sesi 1':bank.short)} · ${fmtNum(q.n)}</span><span class="qtopic">${safe(q.topic)}</span></div><div class="prompt">${safe(q.q)}</div>${itemImage(q)}<div class="options" role="radiogroup" aria-label="Pilihan jawaban">${q.options.map((v,n)=>{let letter=String.fromCharCode(65+n),sel=pick===letter,css=review?(q.status==='fixed'&&q.key===letter?' showCorrect':sel&&q.status==='fixed'&&q.key!==letter?' showWrong':' locked'):sel?' selected':'';return `<label class="option${css}" data-act="pick" data-id="${q.id}" data-letter="${letter}" tabindex="${review?-1:0}"><input type="radio" name="answer-${q.id}" value="${letter}" ${sel?'checked':''} ${review?'disabled':''}><span class="opLetter">${letter}</span><span class="opText">${safe(v)}</span></label>`}).join('')}</div><div class="questionActions"><div class="leftBtns"><button class="btn ghost sm" data-act="navQ" data-step="-1" ${i===0?'disabled':''}>${ico('left',15)} Sebelumnya</button><button class="btn ghost sm" data-act="navQ" data-step="1" ${i>=ids.length-1?'disabled':''}>Berikutnya ${ico('right',15)}</button></div>${!review&&!isExam?`<button class="btn" data-act="check" ${!pick?'disabled':''}>${ico('check',17)} Periksa jawaban</button>`:isExam&&i===ids.length-1?`<button class="btn" data-act="submitExam">${ico('check',17)} Periksa seluruh simulasi</button>`:isExam?`<span class="caption">Kunci belum ditampilkan</span>`:i===ids.length-1?`<button class="btn" data-act="goto" data-view="results">Lihat hasil ${ico('arrow',16)}</button>`: `<button class="btn" data-act="navQ" data-step="1">Lanjut ${ico('arrow',16)}</button>`}</div>${review?feedback(q,pick,ex):`<div class="rule" style="margin-bottom:12px"></div><p class="caption">Pilih satu jawaban. ${isExam?'Semua pembahasan tetap tersembunyi sampai simulasi diperiksa.':'Kunci, alasan, dan catatan dari sumber baru muncul sesudah kamu memeriksa soal ini.'}</p>`}</section><aside class="quizAside"><div class="asideBox"><div class="asideTitle">Navigasi soal</div><div class="asideProgress"><span>${isExam?'Terisi':'Diperiksa'}</span><b>${checkedCount} / ${ids.length}</b></div><div class="thinbar"><b style="width:${pct(checkedCount,ids.length)}%"></b></div><div class="pageNav">${ids.map((id,z)=>{let r=mapQ[id],isDone=ex?!!st.exam.picks[id]:!!st.progress[id]?.checked;return `<button class="pageNum ${z===i?'current':isDone?'done':''}" title="${safe(r.bank)} nomor ${r.n}" data-act="goQ" data-index="${z}">${r.n}</button>`}).join('')}</div><p class="asideSmall">${timing} Soal yang sudah kamu isi disimpan di browser ini.</p></div><div class="asideBox"><div class="asideTitle">Belajar lebih efektif</div><p class="asideSmall">Sebelum memilih, cari kata seperti <em>kecuali</em>, <em>paling tepat</em>, bagian anatomi, atau fase fisiologinya. Setelah salah, jelaskan ulang konsep dengan satu kalimat.</p><div class="miniHR"></div><div class="keyboard"><kbd>1</kbd> hingga <kbd>5</kbd> pilih opsi <kbd>Enter</kbd> periksa <kbd>←</kbd> <kbd>→</kbd> navigasi</div></div><div class="asideBox"><div class="asideTitle">Sumber</div><div class="sourceNote">${safe(bank.title)} · Halaman ${q.page} PDF. ${BUNDLE?'PDF asli ada dalam folder source_docs pada paket ZIP.':'Untuk membuka PDF asli dari web, gunakan paket ZIP lengkap.'}</div></div></aside></div></main>`}
function feedback(q,pick,ex){let fixed=q.status==='fixed', correct=fixed&&pick===q.key, tentative=q.status!=='fixed';let altText=q.status==='missing'?'PDF tidak menandai jawaban resmi untuk nomor ini.':q.status==='disputed'?'Kunci PDF bertentangan dengan konsep yang dijelaskan pada pembahasan.':q.status==='tentative'?'Kunci diberi warna tentatif di PDF dan belum dipastikan.':'';const answerKey=q.key?`${q.key}. ${safe(q.options[q.key.charCodeAt(0)-65])}`:'Belum tersedia';const banner=fixed?correct?{t:'Sesuai kunci sumber',s:'Kamu menangkap konsep yang diuji.',cls:''}:{t:'Belum sesuai kunci sumber',s:'Baca alur di bawah, lalu ulangi lagi nanti.',cls:'no'}:{t:'Perlu catatan sumber',s:altText,cls:'warn'};let f=st.flowSeen[q.id]||1;return `<div class="feedback"><div class="feedbackHeader ${banner.cls}">${ico(fixed?(correct?'check':'x'):'alert',25)}<div><strong>${banner.t}</strong><span>${banner.s}</span></div></div><div class="answerLine"><b>${q.key?'Kunci yang tertulis di PDF':'Kunci PDF'}</b> · ${answerKey}${!fixed?' <span style="color:#956b36">(tidak masuk nilai pasti)</span>':''}</div><div class="fBlock"><h3><span>01</span> Apa yang sedang ditanyakan?</h3><p>${safe(q.clue)}</p></div><div class="fBlock"><h3><span>02</span> Bayangkan seperti ini</h3><p>${safe(q.mental)}</p></div><div class="fBlock"><h3><span>03</span> Mengapa begitu?</h3><p>${safe(q.why)}</p></div>${q.flow?.length?`<div class="fBlock"><h3><span>04</span> Alur sederhana</h3><div class="flow">${q.flow.slice(0,f).map((n,i)=>`<div class="flowNode">${safe(n)}</div>${i+1<Math.min(f,q.flow.length)?'<span class="flowArrow">→</span>':''}`).join('')}</div>${f<q.flow.length?`<button class="btn soft sm" data-act="flow" data-id="${q.id}">${ico('plus',14)} Langkah berikutnya</button>`:''}</div>`:''}<div class="fBlock"><h3><span>${q.flow?.length?'05':'04'}</span> Bahas setiap opsi</h3><div class="optionReview">${q.options.map((v,i)=>`<div class="orow"><b>${String.fromCharCode(65+i)}</b><div>${safe(q.choicesWhy[i])}</div></div>`).join('')}</div></div>${q.term?`<div class="fBlock"><h3><span>+</span> Arti istilah</h3><div class="termBox">${safe(q.term)}</div></div>`:''}${q.note?`<div class="warnbox"><b>Catatan ilmiah</b><br>${safe(q.note)}</div>`:''}<div class="afterActions"><button class="btn soft sm" data-act="mark" data-id="${q.id}">${ico('bookmark',14)} ${st.marks[q.id]?'Hapus tanda simpan':'Simpan untuk dipelajari'}</button>${BUNDLE?`<a class="btn ghost sm" target="_blank" rel="noopener noreferrer" href="source_docs/${encodeURIComponent(getBank(q.bank).file)}#page=${q.page}">${ico('book',15)} Lihat halaman PDF</a>`:''}</div></div>`}
function startBank(bank){st.exam=null;st.view='quiz';st.bank=bank;st.mode='bank';st.queue=Q.filter(x=>x.bank===bank).map(x=>x.id);let ix=st.queue.findIndex(id=>!st.progress[id]?.checked);st.at=ix<0?0:ix;st.sidebarOpen=false;persist();render();window.scrollTo(0,0)}
function startPracticeReview(type){let arr=Q.filter(x=>{let p=st.progress[x.id];return (type==='missed'?!!(p?.checked&&p.choice!==x.key&&x.status==='fixed'):!!st.marks[x.id])});if(!arr.length){toast(type==='missed'?'Belum ada jawaban salah untuk diulang.':'Belum ada soal yang disimpan.');return}st.exam=null;st.view='quiz';st.mode='review';st.queue=arr.map(x=>x.id);st.at=0;if(type==='missed'){arr.forEach(x=>{st.progress[x.id]={...st.progress[x.id],choice:'',checked:false}})}st.sidebarOpen=false;persist();render();window.scrollTo(0,0)}
function choicePick(id,letter){let {ex,q}=currentData();if(!q||q.id!==id||isChecked(q,ex))return;if(ex){st.exam.picks[id]=letter}else{st.progress[id]={...(st.progress[id]||{}),choice:letter,checked:false}}persist();render(false)}
function checkCurrent(){let {ex,q}=currentData();if(ex||!q||!st.progress[q.id]?.choice||st.progress[q.id]?.checked)return;let p=st.progress[q.id];p.checked=true;p.last=Date.now();p.attempts=(p.attempts||0)+1;p.history=[...(p.history||[]),{choice:p.choice,at:p.last}].slice(-15);st.progress[q.id]=p;st.flowSeen[q.id]=1;persist();render();const fb=document.querySelector('.feedback');fb?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function goQuestion(num){let ex=activeExam();let arr=ex?st.exam.ids:practiceIds();if(ex)st.exam.at=Math.min(Math.max(0,num),arr.length-1);else st.at=Math.min(Math.max(0,num),arr.length-1);persist();render();window.scrollTo(0,0)}
function submitExam(){if(!activeExam()||st.exam.reviewed)return;let blank=st.exam.ids.filter(id=>!st.exam.picks[id]).length;if(blank>0&&!confirm(`Masih ada ${blank} soal kosong. Periksa simulasi sekarang?`))return;st.exam.reviewed=true;st.view='results';st.sidebarOpen=false;persist();render()}
function go(v){st.view=v;st.sidebarOpen=false;persist();render();window.scrollTo(0,0)}
function results(){const ex=st.exam?.reviewed;let ids=ex?st.exam.ids:ALL_IDS;let seen=ids.filter(id=>ex||st.progress[id]?.checked);let fixed=seen.filter(id=>mapQ[id].status==='fixed');let correct=fixed.filter(id=>(ex?st.exam.picks[id]:st.progress[id]?.choice)===mapQ[id].key);let missed=fixed.filter(id=>(ex?st.exam.picks[id]:st.progress[id]?.choice)!==mapQ[id].key);let unclear=seen.filter(id=>mapQ[id].status!=='fixed');let nt=ids.filter(id=>ex?!st.exam.picks[id]:!st.progress[id]?.checked);let topicMiss={};missed.forEach(id=>topicMiss[mapQ[id].topic]=(topicMiss[mapQ[id].topic]||0)+1);let wrongTopics=Object.entries(topicMiss).sort((a,b)=>b[1]-a[1]);return `<main class="view narrow"><div class="eyebrow">Hasil belajar</div><div class="resulthead"><div><h1 class="quiztitle">${ex?'Hasil simulasi':'Rekap latihanmu'}</h1><p class="lede" style="font-size:14px">Skor hanya memakai soal yang mempunyai kunci sumber tetap. Soal tanpa kunci, berkunci sementara, atau bermasalah tetap bisa dibahas.</p></div><div style="text-align:right"><div class="resultScore">${pct(correct.length,fixed.length)}%</div><div class="caption">${correct.length} dari ${fixed.length} kunci tetap</div></div></div><div class="metricGrid"><div class="metric"><span>Sesuai kunci</span><strong>${correct.length}</strong></div><div class="metric"><span>Perlu diulang</span><strong>${missed.length}</strong></div><div class="metric"><span>Kunci belum pasti</span><strong>${unclear.length}</strong></div><div class="metric"><span>Belum dikerjakan</span><strong>${nt.length}</strong></div></div><div class="toolbar">${missed.length&&!ex?`<button class="btn" data-act="reviewMissed">${ico('rotate',16)} Ulang soal salah</button>`:''}${ex?`<button class="btn" data-act="viewExamReview">Lihat setiap soal ${ico('arrow',16)}</button>`:''}<button class="btn ghost" data-act="goto" data-view="home">Pilih kumpulan lain</button></div>${wrongTopics.length?`<div class="sectiontop"><h2 class="sectiontitle">Konsep yang perlu ditinjau</h2></div><div class="topicChips">${wrongTopics.map(([t,n])=>`<button data-act="topicSearch" data-topic="${safe(t)}">${safe(t)} · ${n} salah</button>`).join('')}</div>`:''}<div class="sectiontop"><h2 class="sectiontitle">Rekap per nomor</h2><span class="sectionmeta">Ketuk untuk melihat soal</span></div><div class="rows">${ids.map((id,i)=>{let q=mapQ[id],p=ex?st.exam.picks[id]:st.progress[id]?.choice,rev=ex?!!st.exam.reviewed:!!st.progress[id]?.checked,good=rev&&q.status==='fixed'&&p===q.key,uncert=rev&&q.status!=='fixed',txt=!rev?'Belum diperiksa':uncert?'Kunci belum pasti':good?'Sesuai kunci':'Perlu review';return `<button class="rowItem" data-act="resultQuestion" data-id="${id}"><div><b>${safe(getBank(q.bank).short)} · No. ${q.n}</b><small>${safe(q.topic)} · ${safe(q.q.slice(0,110))}${q.q.length>110?'…':''}</small></div><span class="resultTag ${!rev||uncert?'unknown':good?'':'bad'}">${txt}</span></button>`}).join('')}</div><div class="footer">Penilaian menunjukkan kecocokan dengan kunci PDF, bukan validasi soal resmi. Beberapa kunci asli memiliki masalah ilmiah yang diterangkan setelah memeriksa soal.</div></main>`}
function examSetup(){return `<main class="view narrow"><div class="eyebrow">Uji diri tanpa pembahasan awal</div><h1 class="quiztitle" style="margin-top:14px">Simulasi ujian</h1><p class="lede">Kamu menjawab serangkaian soal terlebih dahulu. Kunci, nilai dan pembahasan baru muncul ketika menekan <strong>Periksa seluruh simulasi</strong>.</p><div class="settingsCard" style="max-width:670px;margin-top:27px"><h3>Pilih cakupan</h3><p>Gunakan satu dokumen untuk latihan terarah, atau campur seluruh soal untuk latihan seperti ujian.</p><div class="toolbar"><select class="select" id="examBank" style="max-width:none;flex:1"><option value="all">Semua dokumen · 58 soal</option>${BANKS.map(b=>`<option value="${b.id}">${safe(b.title)} · ${Q.filter(q=>q.bank===b.id).length} soal</option>`).join('')}</select><select class="select" id="examCount"><option value="15">15 soal</option><option value="25">25 soal</option><option value="all">Seluruh soal dalam paket</option></select></div><label class="checkrow"><input id="examShuffle" type="checkbox" checked> Acak urutan soal</label><button class="btn" data-act="startExam">Mulai simulasi ${ico('arrow',15)}</button></div>${st.exam?.active&&!st.exam.reviewed?`<div class="nextcard"><div><strong>Simulasi sebelumnya masih berlangsung</strong><p>Jawaban tersimpan sementara di browser yang sama.</p></div><button class="btn soft" data-act="resumeExam">Lanjutkan</button></div>`:''}<div class="footer">Soal tanpa kunci pasti tetap disertakan dan tidak masuk nilai pasti. Waktu ujian tidak dibatasi agar kamu bisa mengutamakan pemahaman.</div></main>`}
function startExam(){const target=document.getElementById('examBank')?.value||'all';const c=document.getElementById('examCount')?.value||'15';const shuffle=!!document.getElementById('examShuffle')?.checked;let ids=Q.filter(q=>target==='all'||q.bank===target).map(q=>q.id);if(shuffle)ids=ids.map(id=>({id,x:Math.random()})).sort((a,b)=>a.x-b.x).map(x=>x.id);if(c!=='all')ids=ids.slice(0,Number(c));st.exam={active:true,ids,picks:{},reviewed:false,at:0,created:Date.now()};st.view='quiz';st.sidebarOpen=false;persist();render();window.scrollTo(0,0)}
function resumeExam(){if(st.exam?.active){st.view='quiz';st.sidebarOpen=false;persist();render()}}
function library(){let banks=[{id:'all',title:'Semua paket'},...BANKS];let arr=Q.filter(q=>(st.filterBank==='all'||q.bank===st.filterBank)&&(st.filterTopic==='all'||q.topic===st.filterTopic)&&(!st.search||`${q.q} ${q.options.join(' ')} ${q.topic}`.toLowerCase().includes(st.search.toLowerCase())));let topics=[...new Set(Q.filter(q=>st.filterBank==='all'||q.bank===st.filterBank).map(q=>q.topic))].sort();return `<main class="view narrow"><div class="eyebrow">Daftar soal</div><h1 class="quiztitle">Cari dan ulangi materi</h1><p class="lede" style="font-size:14px">Pencarian hanya memperlihatkan pertanyaan dan asalnya. Kunci baru terlihat sesudah kamu memeriksa jawaban.</p><div class="toolbar"><div style="position:relative;flex:1;min-width:240px"><span style="position:absolute;left:12px;top:13px;color:var(--muted)">${ico('search',17)}</span><input class="input" id="searchInput" style="width:100%;padding-left:39px" placeholder="Cari soal atau istilah…" value="${safe(st.search)}"></div><select class="select" id="filterBank">${banks.map(b=>`<option ${st.filterBank===b.id?'selected':''} value="${b.id}">${safe(b.title)}</option>`).join('')}</select><select class="select" id="filterTopic"><option value="all">Semua topik</option>${topics.map(t=>`<option ${st.filterTopic===t?'selected':''}>${safe(t)}</option>`).join('')}</select></div><div class="sectiontop"><h2 class="sectiontitle">${arr.length} soal ditemukan</h2><span class="sectionmeta">Total 58 soal</span></div>${arr.length?`<div class="searchResults">${arr.map(q=>`<button class="searchItem" data-act="openOne" data-id="${q.id}"><div><strong>${safe(q.q)}</strong><span>${safe(getBank(q.bank).short)} · Nomor ${q.n} · Halaman ${q.page} · ${safe(q.topic)}</span></div>${ico('arrow',17)}</button>`).join('')}</div>`:`<div class="empty"><h3>Tidak ada soal yang cocok</h3><p>Coba kata yang lebih umum atau pilih semua topik.</p></div>`}</main>`}
function cardSet(){let arr=CARDS.filter(c=>st.flashFilter==='all'||(st.flashFilter==='due'?(!st.cards[c.id]||st.cards[c.id].due<=Date.now()):st.flashFilter==='new'?!st.cards[c.id]:false));return arr}
function cardsView(){let arr=cardSet();let idx=Math.min(st.flashIndex,Math.max(arr.length-1,0));let card=arr[idx];const due=CARDS.filter(c=>!st.cards[c.id]||st.cards[c.id].due<=Date.now()).length;let learned=CARDS.filter(c=>st.cards[c.id]?.n).length;return `<main class="view narrow"><div class="eyebrow">Active recall</div><div class="quizhead"><div><h1 class="quiztitle">Flashcard konsep</h1><div class="quizsub">${CARDS.length} kartu. Ketuk kartu untuk melihat jawabannya, lalu pilih tingkat pemahamanmu.</div></div><button class="btn ghost sm" data-act="goto" data-view="home">Kembali</button></div><div class="toolbar"><div class="seg"><button class="${st.flashFilter==='due'?'current':''}" data-act="cardFilter" data-filter="due">Perlu diulang (${due})</button><button class="${st.flashFilter==='all'?'current':''}" data-act="cardFilter" data-filter="all">Semua</button><button class="${st.flashFilter==='new'?'current':''}" data-act="cardFilter" data-filter="new">Belum dipelajari</button></div><span class="caption">${learned} kartu pernah dipelajari</span></div>${card?`<div class="cardWrap"><div class="flashcard ${st.flashFlipped?'flipped':''}" data-act="flipCard" role="button" tabindex="0" aria-label="Balik kartu"><div class="flashInner"><div class="flashFace"><div class="flashtop">${safe(card.topic)} · ${idx+1} dari ${arr.length}</div><div class="flashFront">${safe(card.front)}</div><div class="flashhint">Ketuk untuk melihat penjelasan</div></div><div class="flashFace flashBack"><div class="flashtop">Jawaban & pemahaman</div><p>${safe(card.back)}</p><div class="flashhint">Tandai agar kartu dijadwalkan ulang</div></div></div></div><div class="flashcontrols">${st.flashFlipped?`<button class="btn ghost" data-act="cardGrade" data-grade="again">Belum paham</button><button class="btn soft" data-act="cardGrade" data-grade="know">Sudah paham</button><button class="btn" data-act="cardGrade" data-grade="easy">Mudah</button>`:`<button class="btn" data-act="flipCard">Lihat jawaban ${ico('rotate',16)}</button>`}</div><div class="caption" style="text-align:center">Belum paham: ulang lagi dalam 2 menit. Sudah paham: ulang 3 hari. Mudah: ulang 7 hari.</div></div>`:`<div class="empty"><h3>Semua kartu untuk filter ini sudah selesai</h3><p>Tanggal pengulangan berikutnya disimpan secara lokal di browser.</p><button class="btn" data-act="cardFilter" data-filter="all">Buka semua kartu</button></div>`}<div class="footer">Flashcard ini merupakan ringkasan konsep yang muncul pada empat PDF. Baca pembahasan lengkap setelah mengerjakan soal untuk memeriksa pengecoh.</div></main>`}
function gradeCard(grade){let arr=cardSet(),card=arr[Math.min(st.flashIndex,arr.length-1)];if(!card)return;let days=grade==='again'?0:grade==='know'?3:7;let delay=grade==='again'?120000:days*86400000;st.cards[card.id]={n:(st.cards[card.id]?.n||0)+1,due:Date.now()+delay,last:Date.now(),grade};st.flashFlipped=false;st.flashIndex=st.flashFilter==='all'?(st.flashIndex+1)%CARDS.length:0;persist();render();toast(grade==='again'?'Kartu tetap dalam daftar ulang.':'Jadwal pengulangan kartu disimpan.')}
function settings(){return `<main class="view narrow"><div class="eyebrow">Penyimpanan lokal</div><h1 class="quiztitle">Pengaturan</h1><p class="lede" style="font-size:14px">Jawaban tersimpan hanya di browser ini. Ekspor progres sebelum mengganti perangkat atau menghapus data browser.</p><div class="settingsGrid" style="margin-top:24px"><div class="settingsCard"><h3>Cadangkan progres</h3><p>Simpan pilihan jawaban, hasil koreksi, penanda soal, dan jadwal flashcard sebagai berkas JSON.</p><button class="btn" data-act="export">${ico('download',17)} Ekspor progres</button></div><div class="settingsCard"><h3>Pulihkan progres</h3><p>Impor file JSON yang sebelumnya kamu ekspor dari web SELA. Impor akan menggantikan progres saat ini.</p><button class="btn ghost" data-act="import">${ico('upload',17)} Impor progres</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><div class="settingsCard"><h3>Mulai ulang</h3><p>Hapus jawaban, penanda, hasil latihan dan jadwal kartu dari browser ini. Tidak dapat dibatalkan tanpa file cadangan.</p><button class="btn danger" data-act="reset">Hapus progres</button></div><div class="settingsCard"><h3>Asal bank soal</h3><p>Empat PDF asli yang kamu berikan. Terdapat 58 soal, dan enam gambar soal diambil dari halaman PDF tanpa menampilkan pembahasan saat pengerjaan.</p><p>${BUNDLE?'Paket ZIP ini menyertakan semua PDF asal di folder source_docs.':'Unduh paket ZIP untuk mendapatkan salinan empat PDF asal dan kode sumber.'}</p></div></div><div class="footer">Web berjalan offline. Tidak ada akun, login, server, atau pengumpulan jawaban.</div></main>`}
function render(scroll=false){document.getElementById('root').innerHTML=shell(st.view==='quiz'?quiz():st.view==='results'?results():st.view==='exam_setup'?examSetup():st.view==='library'?library():st.view==='cards'?cardsView():st.view==='settings'?settings():home());document.title=(st.view==='quiz'?`${currentData().q?.bank?.toUpperCase()||'Cumex'} · `:'')+'SELA · Latihan Cumex';if(scroll)window.scrollTo(0,0)}
function inspectClicked(ev){let el=ev.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;switch(act){case'menu':st.sidebarOpen=!st.sidebarOpen;render();break;case'goto':go(el.dataset.view);break;case'bank':startBank(el.dataset.bank);break;case'pick':choicePick(el.dataset.id,el.dataset.letter);break;case'check':checkCurrent();break;case'navQ':goQuestion((activeExam()?st.exam.at:st.at)+Number(el.dataset.step));break;case'goQ':goQuestion(Number(el.dataset.index));break;case'mark':st.marks[el.dataset.id]=!st.marks[el.dataset.id];persist();render();toast(st.marks[el.dataset.id]?'Soal disimpan.':'Soal tidak lagi disimpan.');break;case'flow':st.flowSeen[el.dataset.id]=(st.flowSeen[el.dataset.id]||1)+1;render();document.querySelector('.feedback')?.scrollIntoView({block:'nearest'});break;case'zoom':st.lightbox=el.dataset.img;render();break;case'closeimg':st.lightbox=null;render();break;case'reviewMissed':startPracticeReview('missed');break;case'submitExam':submitExam();break;case'startExam':startExam();break;case'resumeExam':resumeExam();break;case'resultQuestion':{let id=el.dataset.id;if(st.exam?.reviewed&&st.exam.ids.includes(id)){st.exam.at=st.exam.ids.indexOf(id);st.view='quiz';persist();render(true)}else{let q=mapQ[id];st.exam=null;st.mode='bank';st.bank=q.bank;st.queue=Q.filter(x=>x.bank===q.bank).map(x=>x.id);st.at=st.queue.indexOf(id);st.view='quiz';persist();render(true)}break;}case'viewExamReview':st.exam.at=0;st.view='quiz';persist();render(true);break;case'openOne':{let q=mapQ[el.dataset.id];st.exam=null;st.mode='bank';st.bank=q.bank;st.queue=Q.filter(x=>x.bank===q.bank).map(x=>x.id);st.at=st.queue.indexOf(q.id);st.view='quiz';persist();render(true);break;}case'topicSearch':st.filterTopic=el.dataset.topic;st.filterBank='all';st.search='';go('library');break;case'cardFilter':st.flashFilter=el.dataset.filter;st.flashIndex=0;st.flashFlipped=false;persist();render();break;case'flipCard':st.flashFlipped=!st.flashFlipped;render();break;case'cardGrade':gradeCard(el.dataset.grade);break;case'export':exportData();break;case'import':document.getElementById('importFile')?.click();break;case'reset':if(confirm('Hapus semua progres latihan di browser ini?')){try{localStorage.removeItem(KEY)}catch(_){}location.reload()}break;default:break}}
function exportData(){let blob=new Blob([JSON.stringify({app:'sela-cumex',version:1,date:new Date().toISOString(),progress:st.progress,marks:st.marks,cards:st.cards},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sela-progres-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Berkas progres dibuat.');}
async function doImport(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='sela-cumex'||!obj.progress||!obj.cards||!obj.marks)throw Error('Format cadangan tidak cocok.');if(!confirm('Ganti progres saat ini dengan progres dari file?'))return;st.progress=obj.progress;st.cards=obj.cards;st.marks=obj.marks;st.exam=null;persist();render();toast('Progres berhasil dipulihkan.')}catch(e){toast(`Impor gagal: ${e.message}`)}}
document.addEventListener('click',inspectClicked);
document.addEventListener('change',ev=>{if(ev.target?.id==='importFile')doImport(ev.target.files[0]);if(ev.target?.id==='filterBank'){st.filterBank=ev.target.value;st.filterTopic='all';persist();render()}if(ev.target?.id==='filterTopic'){st.filterTopic=ev.target.value;persist();render()}});
document.addEventListener('input',ev=>{if(ev.target?.id==='searchInput'){st.search=ev.target.value;persist();let pos=ev.target.selectionStart;render();let field=document.getElementById('searchInput');if(field){field.focus();field.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&st.lightbox){st.lightbox=null;render();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(st.view==='cards'&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();st.flashFlipped=!st.flashFlipped;render();return}if(st.view!=='quiz')return;let {ex,q}=currentData();if(!q)return;if(!isChecked(q,ex)&&/^[1-5]$/.test(ev.key)&&Number(ev.key)<=q.options.length){choicePick(q.id,String.fromCharCode(64+Number(ev.key)));return}if(ev.key==='Enter'&&!ex&&!isChecked(q,ex)){checkCurrent();return}if(ev.key==='ArrowLeft'){goQuestion((ex?st.exam.at:st.at)-1);return}if(ev.key==='ArrowRight'){goQuestion((ex?st.exam.at:st.at)+1);return}});
render();
</script>
</body>
